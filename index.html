<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Hanken+Grotesk:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   KOSMUS KARANGPANAS — glass + neon red / neon yellow
   Display: Archivo (expanded) · Text: Hanken Grotesk · Mono: DM Mono
═══════════════════════════════════════════════════════════ */
:root {
  --bg: #0b0507;
  --ink: #fbf4ee;
  --mute: rgba(251,244,238,.64);
  --faint: rgba(251,244,238,.38);
  --line: rgba(255,255,255,.11);
  --line-2: rgba(255,255,255,.18);
  --red: #ff2a4a;
  --red-deep: #c4102e;
  --yellow: #ffe62e;
  --orange: #ff9a3c;
  --pink: #ff6fa0;
  --cream: #ffe3bd;
  --panel: rgba(26,11,15,.86);
  --glass: linear-gradient(160deg, rgba(255,255,255,.085), rgba(255,255,255,.025));
  --glass-strong: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
  --glass-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 12px 32px rgba(0,0,0,.28);
  --blur: blur(20px) saturate(150%);
  --display: 'Archivo', 'Hanken Grotesk', sans-serif;
  --text: 'Hanken Grotesk', -apple-system, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, monospace;
  --brand: 'Unbounded', 'Archivo', sans-serif;
  --radius: 22px;
  /* old names still used inline by a few elements */
  --acid: var(--yellow); --mint: var(--red); --sky: var(--orange); --coral: var(--red); --violet: var(--cream);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background:
    radial-gradient(48% 38% at 12% 8%, rgba(255,42,74,.26), transparent 70%),
    radial-gradient(40% 34% at 92% 26%, rgba(255,230,46,.10), transparent 70%),
    radial-gradient(55% 45% at 80% 100%, rgba(196,16,46,.24), transparent 70%),
    radial-gradient(40% 40% at 0% 85%, rgba(255,154,60,.08), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--text);
  font-size: 15px;
  line-height: 1.45;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .06; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
#root { position: relative; z-index: 1; }
button, input, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--yellow); color: #120609; }
:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
.ico { flex-shrink: 0; display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ═══════ BUTTONS ═══════ */
.btn {
  display: inline-flex; align-items: center; gap: .5rem; border: none; border-radius: 999px;
  font: 600 .8rem/1 var(--text); letter-spacing: .02em; padding: .72rem 1.15rem; white-space: nowrap;
  text-decoration: none; transition: background .2s, color .2s, border-color .2s, transform .15s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--yellow); color: #140709; }
.btn.primary:hover:not(:disabled) { background: #fff; }
.btn.ghost { background: var(--glass); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.btn.ghost:hover { box-shadow: inset 0 0 0 1px var(--yellow); color: var(--yellow); }
.link-btn { background: none; border: none; color: var(--yellow); text-decoration: underline; font-size: inherit; }

/* ═══════ TOP NAV ═══════ */
.topnav { position: fixed; top: 14px; left: 0; right: 0; z-index: 200; padding: 0 16px; pointer-events: none; }
.topnav-inner {
  pointer-events: auto; max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: .8rem;
  padding: .45rem .5rem .45rem .55rem; border-radius: 999px;
  background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
  border: 1px solid rgba(255,255,255,.14); box-shadow: var(--glass-shadow);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); transition: background .3s;
}
.topnav.scrolled .topnav-inner { background: linear-gradient(160deg, rgba(40,14,20,.82), rgba(20,8,11,.78)); }
.brandmark { display: flex; align-items: center; gap: .6rem; background: none; border: none; padding: 0 .4rem 0 0; }
.brandmark-logo { width: 34px; height: 34px; border-radius: 50%; background: #fff6ec; display: grid; place-items: center; }
.brandmark-logo img { width: 74%; height: 74%; object-fit: contain; }
.brandmark-text { font: 700 .82rem/1 var(--text); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.navlinks { display: flex; gap: .2rem; margin-left: auto; }
.navlink {
  background: transparent; border: none; border-radius: 999px; padding: .6rem 1rem;
  font: 500 .82rem/1 var(--text); color: var(--ink); opacity: .82; transition: background .2s, opacity .2s, color .2s;
}
.navlink:hover { opacity: 1; background: rgba(255,255,255,.08); }
.navlink.active { background: #fff; color: #140709; opacity: 1; font-weight: 600; }
.nav-right { display: flex; gap: .3rem; }
.nav-right:empty { display: none; }
.nav-cta {
  display: inline-flex; align-items: center; gap: .45rem; border: none; border-radius: 999px; padding: .6rem 1rem;
  background: #140709; color: var(--ink); font: 600 .8rem/1 var(--text); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); transition: .2s;
}
.nav-cta:hover { background: var(--red); }
.nav-cta.on { background: var(--red); color: #fff; }
.nav-cta.warn { color: var(--yellow); }
@media (max-width: 640px) {
  .topnav { top: 10px; padding: 0 10px; }
  .topnav-inner { gap: .3rem; padding: .35rem; }
  .cta-txt { display: none; }
  .topnav-inner { flex-wrap: wrap; border-radius: 24px; row-gap: .35rem; padding: .45rem; }
  .brandmark { flex: 1; padding: 0 0 0 .1rem; min-width: 0; }
  .brandmark-logo { width: 32px; height: 32px; }
  .brandmark-text { font-size: .8rem; }
  .nav-right { order: 2; }
  .navlinks { order: 3; width: 100%; margin: 0; gap: .2rem; justify-content: space-between; }
  .navlink { flex: 1; padding: .6rem .4rem; font-size: .8rem; }
  .nav-cta { padding: .55rem; }
  .menu-page:not(.is-home) .page-wrap { padding-top: 8.6rem; }
}

/* ═══════ HERO ═══════ */
.hero { position: relative; height: 100vh; height: 100svh; min-height: 520px; overflow: hidden; isolation: isolate; }
.hero-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.hero-rings {
  position: absolute; left: 50%; top: 58%; width: 170vmax; height: 170vmax; transform: translate(-50%,-50%);
  background: repeating-radial-gradient(circle, rgba(255,42,74,0) 0 34px, rgba(255,42,74,.13) 40px, rgba(255,42,74,0) 48px);
  -webkit-mask-image: radial-gradient(circle, #000 0 18%, transparent 46%); mask-image: radial-gradient(circle, #000 0 18%, transparent 46%);
  filter: blur(5px); animation: ripple 9s ease-in-out infinite alternate;
}
@keyframes ripple { from { transform: translate(-50%,-50%) scale(1); } to { transform: translate(-50%,-50%) scale(1.07); } }
.hero-glow { position: absolute; border-radius: 50%; filter: blur(70px); }
.hero-glow.g1 { width: 62vmin; height: 62vmin; left: 50%; top: 52%; transform: translate(-50%,-50%); background: rgba(255,42,74,.34); }
.hero-glow.g2 { width: 34vmin; height: 34vmin; right: 8%; top: 22%; background: rgba(255,230,46,.16); }
.hero-stage { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.hero-photo {
  display: block; width: min(88vw, calc(74svh * 1.6)); height: auto; user-select: none; margin-bottom: 4svh;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%), linear-gradient(to bottom, #000 55%, rgba(0,0,0,.35) 80%, transparent 98%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%), linear-gradient(to bottom, #000 55%, rgba(0,0,0,.35) 80%, transparent 98%);
  mask-composite: intersect;
  animation: fadeIn .9s ease both;
}
.hero-title {
  position: absolute; left: 0; right: 0; bottom: 12svh; text-align: center; z-index: 3;
  font-family: var(--brand); font-weight: 600; text-transform: uppercase; color: #fff;
  font-size: clamp(1.6rem, 4.4vw, 4.6rem); letter-spacing: .02em; line-height: 1.08;
  text-shadow: 0 2px 30px rgba(0,0,0,.6); animation: rise 1s .15s ease both;
}
.hero-title span { display: inline-block; }
.hero-scroll {
  position: absolute; left: 50%; bottom: max(18px, 4svh); transform: translateX(-50%); z-index: 4;
  width: min(560px, 82vw); background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: .7rem;
}
.hero-scroll-label { font: 500 .62rem/1 var(--text); letter-spacing: .5em; text-transform: uppercase; color: var(--mute); padding-left: .5em; }
.hero-track { position: relative; width: 100%; height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
.hero-bar { position: absolute; inset: 0; background: linear-gradient(90deg, var(--red), var(--yellow)); transform-origin: left; transform: scaleX(.08); border-radius: 4px; }
.hero-scroll:hover .hero-scroll-label { color: var(--yellow); }
/* upright screens (phones, tablets in portrait) */
@media (max-aspect-ratio: 1/1) {
  .hero-stage { justify-content: center; padding: 70px 0 2svh; }
  .hero-scroll { position: relative; left: auto; bottom: auto; transform: none; margin-top: 8svh; }
  .hero-photo { width: min(104vw, calc(52svh * 1.6)); margin-bottom: 0; }
  .hero-title { position: relative; bottom: auto; margin-top: -8vw; font-size: clamp(1.6rem, 9vw, 4.4rem); letter-spacing: .01em; }
  .hero-title span { display: block; }
}

/* ═══════ PAGES ═══════ */
.menu-page { min-height: 100vh; }
.page-wrap { max-width: 1080px; margin: 0 auto; padding: 4.5rem clamp(1rem,4vw,2rem) 3rem; animation: fadeIn .35s ease; }
.menu-page:not(.is-home) .page-wrap { padding-top: 7.5rem; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
.kicker { font: 600 .66rem/1 var(--text); letter-spacing: .3em; text-transform: uppercase; color: var(--red); margin-bottom: .7rem; }
.page-title { font: 600 clamp(2.2rem,6vw,3.8rem)/.95 var(--display); font-stretch: 112%; letter-spacing: -.02em; text-transform: uppercase; }
.page-meta { margin-top: .6rem; font-size: .82rem; color: var(--mute); }
.page-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
.site-footer { display: flex; align-items: center; justify-content: center; gap: .6rem; padding: 2rem 1rem 3rem; color: var(--faint); font-size: .74rem; letter-spacing: .08em; }
.site-footer img { width: 22px; height: 22px; border-radius: 50%; background: #fff6ec; padding: 3px; }

/* search + tags */
.search-row { position: relative; margin-bottom: .8rem; }
.search-ico { position: absolute; left: 1.1rem; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search-input {
  width: 100%; background: var(--glass); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); color: var(--ink);
  padding: .9rem 1.2rem .9rem 3rem; border-radius: 999px; font-size: .95rem; outline: none; transition: border-color .2s;
}
.search-input::placeholder { color: var(--faint); }
.search-input:focus { border-color: var(--yellow); }
.tag-filters { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.2rem; }
.tag-filter {
  display: inline-flex; align-items: center; gap: .45rem; background: rgba(255,255,255,.04); border: 1px solid var(--line);
  border-radius: 999px; padding: .42rem .9rem; font: 500 .78rem/1 var(--text); transition: .15s;
}
.tag-filter:hover { border-color: var(--line-2); background: rgba(255,255,255,.08); }
.tag-filter.on { background: var(--red); border-color: var(--red); color: #fff; }
.tf-n { font: .66rem/1 var(--mono); opacity: .6; }
.empty-note { padding: 2.4rem 1rem; text-align: center; color: var(--mute); }

/* song + setlist rows */
.board-cols, .song-row { display: grid; grid-template-columns: 2.6rem minmax(0,1fr) minmax(0,14rem) 3.4rem 5.4rem 4rem; align-items: center; column-gap: 1rem; }
.board-cols { padding: 0 1.2rem .6rem; font: 600 .6rem/1 var(--text); letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
.song-list { list-style: none; display: flex; flex-direction: column; gap: .55rem; }
.song-list li { animation: rise .45s ease both; }
.song-row {
  position: relative; padding: .95rem 1.2rem; border-radius: 20px; cursor: pointer;
  background: var(--glass); border: 1px solid var(--line); box-shadow: var(--glass-shadow);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); transition: border-color .2s, background .2s, transform .2s;
}
.song-row:hover, .song-row:focus-visible { border-color: rgba(255,230,46,.55); background: var(--glass-strong); transform: translateY(-1px); }
.row-idx { font: 500 .78rem/1 var(--mono); color: var(--red); }
.row-main { display: flex; flex-direction: column; gap: .22rem; min-width: 0; }
.row-title { font: 600 clamp(1rem,2vw,1.18rem)/1.15 var(--display); font-stretch: 108%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-artist { font-size: .78rem; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-prev { display: flex; gap: .3rem; overflow: hidden; }
.mini-chord { font: 600 .74rem/1 var(--display); padding: .3rem .55rem; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line); white-space: nowrap; }
.key-chip { display: inline-block; min-width: 2.5rem; text-align: center; font: 700 .86rem/1 var(--display); font-stretch: 110%; padding: .4rem .6rem; border-radius: 999px; background: var(--yellow); color: #140709; }
.row-sec { font: .8rem/1 var(--mono); color: var(--mute); }
.row-sec em { font: normal .7rem var(--text); color: var(--faint); }
.row-end { display: flex; align-items: center; justify-content: flex-end; gap: .3rem; }
.row-go { color: var(--faint); transition: color .2s, transform .2s; }
.song-row:hover .row-go { color: var(--yellow); transform: translateX(3px); }
.song-del { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent; color: var(--faint); opacity: 0; transition: .2s; }
.song-row:hover .song-del, .song-del:focus-visible { opacity: 1; }
.song-del:hover { background: var(--red); color: #fff; }
@media (hover: none) { .song-del { opacity: .7; } }
.song-row.set-row { grid-template-columns: 4.4rem minmax(0,1fr) 5rem 2rem; }
.set-date { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.set-date b { font: 600 1.7rem/1 var(--display); color: var(--yellow); }
.set-date i { font: normal 500 .6rem/1 var(--text); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin-top: .3rem; }
.set-date.none { color: var(--faint); }
@media (max-width: 860px) {
  .board-cols, .song-row { grid-template-columns: 2.2rem minmax(0,1fr) 3.2rem 2.2rem; }
  .c-prev, .row-prev, .c-sec, .row-sec { display: none; }
  .row-end .song-del { position: absolute; top: .4rem; right: .4rem; }
  .row-end { grid-column: 4; }
  .song-row.set-row { grid-template-columns: 3.6rem minmax(0,1fr) 2rem; }
}
@media (max-width: 520px) {
  .board-cols { display: none; }
  .song-row { grid-template-columns: 1.9rem minmax(0,1fr) auto 1.4rem; column-gap: .7rem; padding: .85rem .9rem; border-radius: 18px; }
  .row-title { white-space: normal; }
}

/* about / help */
.about-page { display: grid; gap: .9rem; }
.about-card { background: var(--glass); border: 1px solid var(--line); box-shadow: var(--glass-shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-radius: var(--radius); padding: 1.6rem 1.7rem; }
.about-card h2 { font: 600 1.15rem/1.2 var(--display); font-stretch: 110%; margin-bottom: .8rem; color: var(--yellow); }
.about-card p { color: var(--mute); line-height: 1.7; margin-bottom: .6rem; }
.about-card p:last-child { margin-bottom: 0; }
.about-card ul { padding-left: 1.1rem; }
.about-card li { color: var(--mute); line-height: 1.8; }
.token-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
.token-table th { text-align: left; padding: .4rem .6rem; font-weight: 600; color: var(--faint); font-size: .64rem; text-transform: uppercase; letter-spacing: .14em; }
.token-table td { padding: .55rem .6rem; border-top: 1px solid var(--line); font-family: var(--mono); vertical-align: top; }
.token-table td:first-child { color: var(--yellow); }
.token-table td:last-child { font-family: var(--text); color: var(--mute); }

/* ═══════ SONG + SETLIST PAGES ═══════ */
.song-page, .setlist-page { min-height: 100vh; }
.song-nav {
  position: sticky; top: 12px; z-index: 100; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  max-width: 1080px; width: calc(100% - 24px); margin: 12px auto 0; padding: .45rem .5rem .45rem .5rem; border-radius: 999px;
  background: linear-gradient(160deg, rgba(40,14,20,.78), rgba(20,8,11,.72)); border: 1px solid rgba(255,255,255,.13);
  box-shadow: var(--glass-shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
}
.back-btn { display: inline-flex; align-items: center; gap: .4rem; background: rgba(255,255,255,.08); border: none; border-radius: 999px; padding: .6rem .95rem; font: 600 .8rem/1 var(--text); transition: .2s; white-space: nowrap; }
.back-btn:hover { background: #fff; color: #140709; }
.nav-logo { width: 32px; height: 32px; border-radius: 50%; background: #fff6ec; padding: 4px; object-fit: contain; flex-shrink: 0; }
.song-nav-title { font: 600 .95rem/1.1 var(--display); font-stretch: 108%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.song-nav-right { margin-left: auto; display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.key-wrap { display: flex; align-items: center; gap: .15rem; background: rgba(255,255,255,.07); border-radius: 999px; padding: .2rem .25rem .2rem .85rem; }
.key-lbl { font: 600 .58rem/1 var(--text); color: var(--faint); text-transform: uppercase; letter-spacing: .16em; margin-right: .25rem; }
.key-step { width: 1.95rem; height: 1.95rem; border-radius: 50%; border: none; background: transparent; font-size: .95rem; font-weight: 700; display: grid; place-items: center; transition: .15s; }
.key-step:hover { background: rgba(255,255,255,.14); }
.key-badge-btn { border: none; background: var(--yellow); color: #140709; font: 700 .95rem/1 var(--display); font-stretch: 110%; padding: .45rem .85rem; border-radius: 999px; min-width: 2.9rem; }
.key-dropdown { position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%); width: 248px; padding: .55rem; display: grid; grid-template-columns: repeat(6,1fr); gap: 4px; z-index: 500; background: #1f0b11; border: 1px solid var(--line-2); border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.55); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.key-opt { padding: .45rem .1rem; text-align: center; border-radius: 10px; font: 600 .8rem/1 var(--display); background: rgba(255,255,255,.05); cursor: pointer; border: 1px solid transparent; }
.key-opt:hover { border-color: var(--yellow); }
.key-opt.active { background: var(--yellow); color: #140709; }
.stage-btn { display: inline-flex; align-items: center; gap: .45rem; border: none; border-radius: 999px; background: var(--red); color: #fff; padding: .62rem 1rem; font: 600 .8rem/1 var(--text); transition: .2s; }
.stage-btn:hover { background: #fff; color: var(--red-deep); }
.song-reset-btn { display: inline-flex; align-items: center; gap: .4rem; border: none; background: transparent; color: var(--mute); padding: .6rem .8rem; border-radius: 999px; font: 500 .8rem/1 var(--text); box-shadow: inset 0 0 0 1px var(--line); transition: .2s; }
.song-reset-btn:hover { color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.save-btn { border: none; border-radius: 999px; background: var(--yellow); color: #140709; padding: .62rem 1.1rem; font: 700 .8rem/1 var(--text); transition: .2s; }
.save-btn:hover { background: #fff; }
.save-btn.saved { background: #fff; }
.save-btn.dirty { animation: pulseSave 1.8s ease-in-out infinite; }
@keyframes pulseSave { 0%,100% { box-shadow: 0 0 0 0 rgba(255,42,74,0); } 50% { box-shadow: 0 0 0 4px rgba(255,42,74,.55); } }
@media (max-width: 600px) {
  .song-nav { border-radius: 24px; gap: .45rem; }
  .song-nav .nav-logo, .song-nav .key-lbl { display: none; }
  .key-wrap { padding-left: .25rem; }
  .stage-btn, .save-btn, .song-reset-btn { padding: .6rem .8rem; }
  .scale-bar { flex-wrap: nowrap; gap: .25rem; }
  .scale-card { flex: 1; min-width: 0; padding: .4rem .2rem; }
  .song-nav-title { max-width: 130px; }
  .bk-txt { display: none; }
  .back-btn { padding: .6rem; }
  .song-nav-right { width: 100%; justify-content: space-between; margin-left: 0; }
  .key-dropdown { left: 0; transform: none; }
}

.song-content { max-width: 1080px; margin: 0 auto; padding: 0 clamp(1rem,4vw,2rem) 5rem; }
.song-hero { padding: clamp(2rem,6vw,3.6rem) 0 1.6rem; animation: fadeIn .35s ease; }
.song-hero h1 { font: 600 clamp(2.2rem,7vw,4.6rem)/.95 var(--display); font-stretch: 112%; letter-spacing: -.02em; text-transform: uppercase; }
.song-hero p { margin-top: .9rem; font: 500 .72rem/1.4 var(--text); letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
.hero-tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
.tag-chip { display: inline-flex; align-items: center; gap: .35rem; font: 600 .68rem/1 var(--text); letter-spacing: .1em; text-transform: uppercase; padding: .38rem .8rem; border-radius: 999px; color: #fff; background: rgba(255,42,74,.22); border: 1px solid rgba(255,42,74,.55); }
.tag-x { background: none; border: none; font-size: .7rem; opacity: .7; }
.tag-x:hover { opacity: 1; }
.tag-add { background: transparent; border: 1px dashed var(--line-2); color: var(--mute); border-radius: 999px; padding: .38rem .8rem; font-size: .7rem; }
.tag-add:hover { border-color: var(--yellow); color: var(--yellow); }

.set-bar { display: flex; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; margin-top: 1.2rem; padding: .55rem .55rem .55rem 1.2rem; border-radius: 999px; background: rgba(255,42,74,.14); border: 1px solid rgba(255,42,74,.45); }
.set-bar-info { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; min-width: 0; }
.set-bar-name { font: 600 .9rem/1.2 var(--display); }
.set-bar-pos { font: .74rem/1 var(--mono); color: var(--yellow); }
.set-bar-note { font: 700 .66rem/1 var(--text); letter-spacing: .12em; text-transform: uppercase; color: #fff; opacity: .8; }
.set-bar-btns { display: flex; gap: .35rem; }
.set-bar-btns button { border: none; border-radius: 999px; background: var(--yellow); color: #140709; padding: .5rem .95rem; font: 700 .74rem/1 var(--text); }
.set-bar-btns button:disabled { opacity: .3; cursor: default; }

.scale-bar { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: 1rem; }
.scale-card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 2.9rem; padding: .45rem .6rem; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.sc-note { font: 600 1rem/1.1 var(--display); color: var(--yellow); }
.sc-deg { font: 700 .52rem/1 var(--text); color: var(--red); letter-spacing: .08em; }
.sc-q { font: .48rem/1 var(--mono); color: var(--faint); }
.legend { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; margin-bottom: 1rem; font-size: .7rem; color: var(--mute); }
.leg-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.toolbar { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.2rem; }
.tb-btn { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 999px; padding: .5rem 1rem; font: 500 .76rem/1 var(--text); transition: .15s; }
.tb-btn:hover { border-color: var(--line-2); background: rgba(255,255,255,.08); }
.tb-btn.on { background: #fff; color: #140709; border-color: #fff; font-weight: 600; }
.tb-sep { width: 1px; height: 1.4rem; background: var(--line); margin: 0 .2rem; }

.section { margin-bottom: 1rem; border-radius: var(--radius); background: var(--glass); border: 1px solid var(--line); box-shadow: var(--glass-shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.sec-hdr { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; padding: .7rem 1.1rem; border-bottom: 1px solid var(--line); }
.sec-name { font: 700 .8rem/1 var(--display); font-stretch: 115%; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: .3rem .4rem; outline: none; max-width: 100%; }
.sec-name:hover { border-color: var(--line); }
.sec-name:focus { border-color: var(--yellow); }
.sec-name-ro { display: inline-block; }
.rep-tag { font: 700 .64rem/1 var(--text); color: var(--yellow); border: 1px solid rgba(255,230,46,.6); padding: .3rem .6rem; border-radius: 999px; cursor: pointer; user-select: none; transition: .15s; }
.rep-tag.empty { color: var(--faint); border-color: var(--line); }
.rep-tag:hover { background: var(--yellow); color: #140709; border-color: var(--yellow); }
.del-sec { margin-left: auto; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: none; background: transparent; color: var(--faint); font-size: .8rem; transition: .15s; }
.del-sec:hover { background: var(--red); color: #fff; }
.sec-body { padding: 1rem 1.1rem .8rem; display: flex; flex-direction: column; gap: .7rem; }
.chord-row { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
.row-num { width: .9rem; text-align: right; font: .56rem/1 var(--mono); color: var(--faint); flex-shrink: 0; }
.chord-pill {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-width: 3.3rem; min-height: 3.1rem; padding: .55rem .9rem .5rem; border-radius: 15px; cursor: pointer; user-select: none; text-align: center;
  background: rgba(255,255,255,.05); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); transition: transform .15s, border-color .15s, background .15s;
}
.chord-pill:hover { transform: translateY(-2px); background: rgba(255,255,255,.09); }
.chord-pill.sel { outline: 2px solid #fff; outline-offset: 2px; }
.chord-pill.t-maj   { border-color: rgba(255,230,46,.38); }
.chord-pill.t-min   { border-color: rgba(255,42,74,.45); background: rgba(255,42,74,.08); }
.chord-pill.t-slash { border-color: rgba(255,154,60,.45); }
.chord-pill.t-chrom { border-color: rgba(255,111,160,.45); }
.chord-pill.t-dim   { border-color: rgba(255,227,189,.4); }
.chord-pill.t-tutti { border: 1.5px dashed rgba(255,230,46,.6); background: transparent; }
.ch-name { font: 700 1.28rem/1.05 var(--display); font-stretch: 106%; white-space: nowrap; }
.chord-pill.t-maj .ch-name   { color: var(--yellow); }
.chord-pill.t-min .ch-name   { color: #ff4d66; }
.chord-pill.t-slash .ch-name { color: var(--orange); }
.chord-pill.t-chrom .ch-name { color: var(--pink); }
.chord-pill.t-dim .ch-name   { color: var(--cream); }
.chord-pill.t-tutti .ch-name { color: var(--yellow); font-size: .74rem; letter-spacing: .18em; }
.chord-pill.t-normal .ch-name { color: var(--ink); }
.ch-sub { font: .52rem/1 var(--mono); color: var(--faint); }
.sep { color: rgba(255,255,255,.2); font-weight: 300; user-select: none; flex-shrink: 0; }
.add-ch-btn { display: inline-flex; align-items: center; justify-content: center; width: 2rem; height: 3.1rem; border: 1px dashed var(--line-2); border-radius: 12px; background: transparent; color: var(--faint); font-size: 1.1rem; transition: .15s; }
.add-ch-btn:hover { border-color: var(--yellow); color: var(--yellow); }
.del-row-btn { width: 1.6rem; height: 3.1rem; border: none; background: transparent; color: var(--faint); font-size: .75rem; transition: .15s; }
.del-row-btn:hover { color: var(--red); }
.add-row-wrap { display: flex; justify-content: center; opacity: 0; transition: .2s; }
.section:hover .add-row-wrap, .section:focus-within .add-row-wrap { opacity: 1; }
@media (hover: none) { .add-row-wrap { opacity: 1; } }
.add-row-btn { background: transparent; border: 1px dashed var(--line-2); color: var(--mute); border-radius: 999px; padding: .3rem 1.4rem; font: 600 .62rem/1 var(--text); letter-spacing: .12em; text-transform: uppercase; }
.add-row-btn:hover { border-color: var(--yellow); color: var(--yellow); }
.song-footer { text-align: center; margin-top: 2.5rem; font: 500 .64rem/1.5 var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }

/* lyrics */
.lyrics { white-space: pre-wrap; margin-top: .3rem; padding: .9rem 1.1rem; border-left: 2px solid var(--red); background: rgba(255,255,255,.03); border-radius: 0 14px 14px 0; font-size: 1rem; line-height: 1.75; }
.lyr-edit { margin-top: .3rem; display: flex; flex-direction: column; align-items: flex-start; gap: .5rem; }
.lyr-input { width: 100%; min-height: 9rem; resize: vertical; padding: .85rem 1rem; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid var(--line-2); font-size: 1rem; line-height: 1.6; outline: none; }
.lyr-input:focus { border-color: var(--yellow); }
.lyr-done { border: none; border-radius: 999px; background: var(--yellow); color: #140709; padding: .5rem 1.1rem; font: 700 .74rem/1 var(--text); }

/* chord editor popup */
.editor-popup { position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%); width: 254px; padding: 1rem; z-index: 600; background: #1f0b11; border: 1px solid rgba(255,230,46,.6); border-radius: 20px; box-shadow: 0 26px 70px rgba(0,0,0,.6); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.ed-preview { font: 700 1.7rem/1.2 var(--display); text-align: center; padding: .45rem; min-height: 3rem; margin-bottom: .7rem; border-radius: 12px; background: rgba(255,255,255,.06); color: var(--yellow); }
.ed-label { font: 600 .58rem/1 var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: .3rem; }
.ed-input { width: 100%; margin-bottom: .65rem; padding: .5rem .7rem; border-radius: 10px; background: rgba(255,255,255,.06); border: 1px solid var(--line-2); font: .9rem var(--mono); outline: none; }
.ed-input:focus { border-color: var(--yellow); }
.ed-group-lbl { font: 600 .52rem/1 var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: .45rem 0 .25rem; }
.ed-grid { display: flex; flex-wrap: wrap; gap: 4px; }
.ed-opt { padding: .3rem .5rem; border-radius: 8px; border: 1px solid transparent; background: rgba(255,255,255,.06); font: .68rem var(--mono); }
.ed-opt:hover { border-color: var(--yellow); }
.ed-opt.on { background: var(--yellow); color: #140709; font-weight: 600; }
.ed-actions { display: flex; gap: .45rem; margin-top: .85rem; }
.ed-del { border: 1px solid var(--line-2); background: transparent; color: var(--mute); border-radius: 999px; padding: .45rem .85rem; font-size: .7rem; }
.ed-del:hover { border-color: var(--red); color: var(--red); }
.ed-ok { flex: 1; border: none; border-radius: 999px; background: var(--yellow); color: #140709; padding: .45rem; font: 700 .74rem/1 var(--text); }
.ed-ok:hover { background: #fff; }
@media (max-width: 600px) {
  .editor-popup { position: fixed; left: .6rem; right: .6rem; bottom: .6rem; top: auto; transform: none; width: auto; max-height: 72vh; overflow-y: auto; animation: rise .25s ease; }
  .ed-input { font-size: 16px; }
}

/* setlist detail */
.set-name-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line-2); font: 600 clamp(2rem,6vw,3.6rem)/1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: -.02em; padding: .2rem 0; outline: none; }
.set-name-input:focus { border-bottom-color: var(--yellow); }
.set-date-input { margin-top: 1rem; padding: .5rem .95rem; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line-2); font-size: .85rem; color-scheme: dark; }
.set-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.4rem; }
.set-items { list-style: none; display: flex; flex-direction: column; gap: .55rem; }
.set-item {
  position: relative; display: grid; grid-template-columns: 2.4rem minmax(0,1fr) auto auto auto; align-items: center; column-gap: .9rem; row-gap: .5rem;
  padding: .85rem 1.1rem; border-radius: 20px; background: var(--glass); border: 1px solid var(--line); box-shadow: var(--glass-shadow);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); transition: border-color .2s;
}
.set-item:hover { border-color: rgba(255,230,46,.5); }
.set-item-main { display: flex; flex-direction: column; gap: .2rem; min-width: 0; cursor: pointer; }
.set-note { font: 700 .66rem/1 var(--text); letter-spacing: .12em; text-transform: uppercase; color: var(--red); margin-top: .2rem; }
.note-input { width: 11rem; padding: .5rem .85rem; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font-size: .78rem; outline: none; }
.note-input:focus { border-color: var(--yellow); }
.set-key { display: flex; align-items: center; gap: .2rem; }
.set-key .key-step { background: rgba(255,255,255,.07); width: 1.8rem; height: 1.8rem; }
.set-ctl { display: flex; gap: .25rem; }
.set-ctl button { width: 2rem; height: 2rem; border-radius: 50%; border: none; background: rgba(255,255,255,.07); font-size: .7rem; transition: .15s; }
.set-ctl button:hover:not(:disabled) { background: #fff; color: #140709; }
.set-ctl button.danger:hover { background: var(--red); color: #fff; }
.set-ctl button:disabled { opacity: .25; cursor: default; }
.set-add { margin-top: 1.1rem; }
@media (max-width: 720px) {
  .set-item { grid-template-columns: 2rem minmax(0,1fr) auto; }
  .note-input { grid-column: 2 / 4; width: 100%; }
  .set-key { grid-column: 2; }
  .set-ctl { grid-column: 3; }
}

/* read-only (viewers) */
.song-page.ro .chord-pill { cursor: default; }
.song-page.ro .chord-pill:hover { transform: none; background: rgba(255,255,255,.05); }
.song-page.ro .chord-pill.t-min:hover { background: rgba(255,42,74,.08); }
.song-page.ro .rep-tag { cursor: default; }
.song-page.ro .rep-tag:hover { background: transparent; color: var(--yellow); }

/* ═══════ STAGE MODE ═══════ */
.song-page.stage .song-nav, .song-page.stage .scale-bar, .song-page.stage .legend, .song-page.stage .toolbar,
.song-page.stage .song-footer, .song-page.stage .add-ch-btn, .song-page.stage .del-row-btn, .song-page.stage .add-row-wrap,
.song-page.stage .del-sec, .song-page.stage .rep-tag.empty, .song-page.stage .row-num, .song-page.stage .hero-tags,
.song-page.stage .set-bar, .song-page.stage .ch-sub, .song-page.stage .lyr-tag { display: none; }
.song-page.stage .song-content { max-width: 1280px; padding-bottom: 12rem; }
.song-page.stage .song-hero { padding: 1.4rem 0 1rem; }
.song-page.stage .song-hero h1 { font-size: clamp(1.8rem,5vw,3.2rem); }
.song-page.stage .ch-name { font-size: calc(1.28rem * var(--sz)); }
.song-page.stage .chord-pill { padding: calc(.55rem * var(--sz)) calc(.9rem * var(--sz)); min-width: calc(3.3rem * var(--sz)); min-height: calc(3.1rem * var(--sz)); border-radius: calc(15px * var(--sz)); cursor: default; }
.song-page.stage .chord-pill:hover { transform: none; }
.song-page.stage .chord-row { gap: calc(.4rem * var(--sz)); }
.song-page.stage .sep { font-size: calc(.9rem * var(--sz)); }
.song-page.stage .sec-name { font-size: calc(.8rem * var(--sz)); }
.song-page.stage .rep-tag { font-size: calc(.64rem * var(--sz)); }
.song-page.stage .sec-body { gap: calc(.7rem * var(--sz)); }
.song-page.stage .lyrics { font-size: calc(1rem * var(--sz)); }
.song-page.stage .chord-pill span[style] { font-size: calc(.5rem * var(--sz)) !important; max-width: none !important; }
.stage-dock {
  position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 700; width: min(720px, calc(100vw - 20px));
  display: flex; flex-direction: column; gap: .5rem; padding: .7rem; border-radius: 28px;
  background: linear-gradient(160deg, rgba(44,15,22,.9), rgba(20,8,11,.88)); border: 1px solid rgba(255,255,255,.14);
  box-shadow: var(--glass-shadow), 0 20px 50px rgba(0,0,0,.5); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
}
.dock-row { display: flex; gap: .45rem; align-items: center; justify-content: center; flex-wrap: wrap; }
.dock-btn { display: inline-flex; align-items: center; gap: .45rem; border: none; border-radius: 999px; padding: .7rem 1.1rem; background: rgba(255,255,255,.08); font: 600 .82rem/1 var(--text); transition: .15s; white-space: nowrap; }
.dock-btn:hover:not(:disabled) { background: rgba(255,255,255,.16); }
.dock-btn:disabled { opacity: .3; cursor: default; }
.dock-btn.exit { color: #ff6b80; }
.dock-btn.play { background: var(--yellow); color: #140709; min-width: 8.2rem; justify-content: center; }
.dock-btn.play:hover:not(:disabled) { background: #fff; }
.dock-btn.play.on { background: var(--red); color: #fff; }
.dock-group { display: flex; align-items: center; gap: .25rem; border-radius: 999px; padding: .2rem .25rem .2rem .85rem; background: rgba(255,255,255,.06); }
.dock-lbl { font: 700 .56rem/1 var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-right: .2rem; }
.dock-mini { width: 2rem; height: 2rem; border-radius: 50%; border: none; background: transparent; font-size: 1rem; font-weight: 700; transition: .15s; }
.dock-mini:hover { background: rgba(255,255,255,.14); }
.dock-val { min-width: 1.6rem; text-align: center; font: 700 .95rem/1 var(--display); color: var(--yellow); }
.dock-val.key { min-width: 2.4rem; }
@media (max-width: 480px) {
  .dock-btn { padding: .6rem .8rem; font-size: .76rem; }
  .dock-btn.play { min-width: 6.6rem; }
  .dock-group { padding-left: .6rem; }
  .dock-mini { width: 1.8rem; height: 1.8rem; }
}

/* ═══════ DIALOGS, TOAST, STATUS ═══════ */
.confirm-overlay { position: fixed; inset: 0; z-index: 9000; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(8,3,5,.66); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fadeIn .15s ease; }
.confirm-box { width: min(400px, 100%); padding: 1.9rem; text-align: center; border-radius: 26px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 30px 80px rgba(0,0,0,.6); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.confirm-box h3 { font: 600 1.3rem/1.2 var(--display); font-stretch: 108%; margin-bottom: .6rem; }
.confirm-box p { color: var(--mute); line-height: 1.6; margin-bottom: 1.4rem; font-size: .9rem; }
.confirm-btns { display: flex; gap: .5rem; justify-content: center; }
.confirm-btns.wrap { flex-wrap: wrap; }
.confirm-cancel, .confirm-ok, .confirm-danger { border: none; border-radius: 999px; padding: .7rem 1.25rem; font: 600 .8rem/1 var(--text); transition: .15s; }
.confirm-cancel { background: rgba(255,255,255,.08); }
.confirm-cancel:hover { background: rgba(255,255,255,.16); }
.confirm-ok { background: var(--yellow); color: #140709; }
.confirm-ok:hover { background: #fff; }
.confirm-ok:disabled { opacity: .5; cursor: default; }
.confirm-danger { background: var(--red); color: #fff; }
.confirm-danger:hover { background: #fff; color: var(--red-deep); }
.pass-input { text-align: center; font-size: 1rem; margin-bottom: .5rem; }
.pass-err { color: #ff6b80; font-size: .82rem; margin-bottom: .8rem; }
.pick-box { width: min(520px, 100%); max-height: 82vh; display: flex; flex-direction: column; gap: .8rem; padding: 1.3rem; border-radius: 26px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 30px 80px rgba(0,0,0,.6); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.pick-head { display: flex; align-items: center; justify-content: space-between; }
.pick-head h3 { font: 600 1.3rem/1 var(--display); font-stretch: 108%; }
.pick-box .search-input { padding-left: 1.2rem; }
.pick-list { overflow-y: auto; display: flex; flex-direction: column; gap: .35rem; }
.pick-row { display: flex; align-items: center; gap: .7rem; text-align: left; padding: .7rem .9rem; border-radius: 14px; border: 1px solid transparent; background: rgba(255,255,255,.04); transition: .15s; }
.pick-row:hover { border-color: rgba(255,230,46,.6); }
.pick-title { flex: 1; min-width: 0; font: 600 .95rem/1.2 var(--display); }
.pick-artist { font-size: .74rem; color: var(--mute); }
.pick-badge { font: 700 .66rem/1 var(--text); background: var(--yellow); color: #140709; padding: .25rem .5rem; border-radius: 999px; }
.pick-plus { color: var(--yellow); font-size: 1.1rem; font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: 5.5rem; transform: translateX(-50%); z-index: 9500; max-width: 90vw; padding: .7rem 1.25rem; border-radius: 999px; background: #fff; color: #140709; font: 600 .84rem/1.2 var(--text); box-shadow: 0 12px 40px rgba(0,0,0,.5); animation: rise .25s ease; }
.dirty-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 400; max-width: calc(100vw - 20px); display: flex; align-items: center; gap: .7rem; padding: .5rem .55rem .5rem 1.15rem; border-radius: 999px; background: var(--panel); border: 1px solid rgba(255,42,74,.6); box-shadow: 0 16px 44px rgba(0,0,0,.5); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); animation: rise .25s ease; }
.dirty-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
.dirty-text { font: 600 .8rem/1 var(--text); white-space: nowrap; }
.dirty-btn { border: none; border-radius: 999px; background: var(--yellow); color: #140709; padding: .6rem 1.05rem; font: 700 .76rem/1 var(--text); white-space: nowrap; }
.dirty-btn:hover { background: #fff; }
.dirty-btn:disabled { opacity: .6; }
.dirty-discard { border: none; background: transparent; color: var(--mute); padding: .5rem .6rem; font-size: .76rem; border-radius: 999px; }
.dirty-discard:hover { color: #ff6b80; }
.status-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 300; background: var(--red); color: #fff; text-align: center; font: 600 .76rem/1.3 var(--text); padding: .4rem 1rem; }
.loading-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
.logo-badge { width: 64px; height: 64px; border-radius: 50%; background: #fff6ec; display: grid; place-items: center; }
.logo-badge img { width: 74%; height: 74%; object-fit: contain; }
.logo-badge.pulse { animation: logoPulse 1.4s ease-in-out infinite; }
@keyframes logoPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.loading-text { font: 500 .74rem/1 var(--text); letter-spacing: .3em; text-transform: uppercase; color: var(--mute); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* sections hold popups: lift the one being edited above its neighbours */
.section { position: relative; }
.section:has(.editor-popup) { z-index: 30; }
.song-nav:has(.key-dropdown) { z-index: 150; }
@media (max-width: 600px) {
  .scale-bar { flex-wrap: nowrap; gap: .25rem; }
  .scale-card { flex: 1 1 0; min-width: 0; padding: .4rem .2rem; }
}

@media (max-width: 640px) and (max-aspect-ratio: 1/1) { .hero-stage { padding-top: 116px; } }
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  if (nm) {
    const root = fmt(sc[+nm[1]-1]);
    const isMin = nm[2]==='m';
    return {display:`${root}${isMin?'m':''}`,sub:token,type:isMin?'min':'maj'};
  }
  return {display:fmt(token),sub:token,type:'normal'};
}

// STORAGE & SHARED DATA
// ═══════════════════════════════════════
const STORE_KEY  = 'chordbook_v2';              // local-mode document {songs,setlists,seen,keys}
const KEYS_KEY   = 'chordbook_keys_v1';         // each person's own key choices
const CACHE_KEY  = 'chordbook_shared_cache_v1'; // last copy downloaded from the shared server
const EDITOR_KEY = 'chordbook_editor_v1';       // editor passcode remembered on this device

// starter tags for the built-in songs (editors can change them)
const DEFAULT_TAGS = {
  sepertimatilampu:['Pop'], song2:['Pop'], song3:['Pop'], song4:['Medley'],
  song5:['Jawa'], song6:['Jawa'], song7:['Kosmus'], song8:['Pop'], song9:['Pop'], song10:['Intro']
};
SONGS_DEFAULT.forEach(s=>{ s.tags = (DEFAULT_TAGS[s.id]||[]).slice(); });

const lsGet = k => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):null; } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); return true; } catch(e){ return false; } };
const clone = o => JSON.parse(JSON.stringify(o));
const snap  = (songs,setlists) => JSON.stringify({songs,setlists});
const pad2  = n => String(n).padStart(2,'0');

// Turn a saved document into live state. Built-in songs added in a newer
// version of the site appear automatically; songs an editor deleted stay deleted.
function buildState(doc) {
  const ids = SONGS_DEFAULT.map(s=>s.id);
  if (!doc || !Array.isArray(doc.songs)) return {songs:clone(SONGS_DEFAULT), setlists:[], seen:ids};
  const have = new Set(doc.songs.map(s=>s.id));
  const seen = new Set(doc.seen||[]);
  const songs = doc.songs.map(s=> (s.tags===undefined && DEFAULT_TAGS[s.id]) ? {...s, tags:DEFAULT_TAGS[s.id].slice()} : s);
  const extra = clone(SONGS_DEFAULT).filter(s=>!have.has(s.id) && !seen.has(s.id));
  return {
    songs:[...songs, ...extra],
    setlists: Array.isArray(doc.setlists) ? doc.setlists : [],
    seen:[...new Set([...(doc.seen||[]), ...ids])]
  };
}

async function apiPost(body) {
  try {
    const r = await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    let j={}; try{ j=await r.json(); }catch(e){}
    return {ok:r.ok,status:r.status,json:j};
  } catch(e) { return {ok:false,status:0,json:{}}; }
}

function initialApp() {
  if (location.protocol==='file:') {
    const st = buildState(lsGet(STORE_KEY));
    return {mode:'local',...st,version:0,snapshot:snap(st.songs,st.setlists)};
  }
  const cache = lsGet(CACHE_KEY);

// ═══════════════════════════════════════
// HASH ROUTER
// ═══════════════════════════════════════
function parseHash() {
  let hash = window.location.hash.replace(/^#\/?/,'');
  let query = '';
  const qi = hash.indexOf('?');
  if (qi>=0) { query = hash.slice(qi+1); hash = hash.slice(0,qi); }
  const params = new URLSearchParams(query);
  if (!hash) return {page:'menu',tab:'home'};
  if (hash==='songs') return {page:'menu',tab:'songs'};
  if (hash==='about') return {page:'menu',tab:'about'};
  if (hash==='setlists') return {page:'menu',tab:'setlists'};
  let m = hash.match(/^setlist\/([^\/]+)$/);
  if (m) return {page:'setlist',setId:decodeURIComponent(m[1])};
  m = hash.match(/^song\/([^\/]+)(?:\/in\/([^\/]+)\/(\d+))?$/);
  if (m) return {page:'song',songId:decodeURIComponent(m[1]),setId:m[2]?decodeURIComponent(m[2]):null,index:m[3]!==undefined?+m[3]:null,stage:params.get('stage')==='1'};
  return {page:'menu',tab:'home'};
}
function setHash(hash) { window.location.hash = hash ? '#/'+hash : '#/'; }

function fmtDate(d) {
  if (!d) return '';
  try { return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); } catch(e){ return d; }
}
function todayStr() { const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

// ═══════════════════════════════════════
// CONFIRM DIALOG
// ═══════════════════════════════════════
function ConfirmDialog({title, message, onConfirm, onCancel, danger}) {
  return h('div',{className:'confirm-overlay',onClick:onCancel},
    h('div',{className:'confirm-box',onClick:e=>e.stopPropagation()},
      h('h3',{},title),
      h('p',{},message),
      h('div',{className:'confirm-btns'},
        h('button',{className:'confirm-cancel',onClick:onCancel},'Cancel'),
        h('button',{className:'confirm-danger',onClick:onConfirm},danger||'Confirm')
      )
    )
  );
}

// ═══════════════════════════════════════
// CHORD PILL COMPONENT
// ═══════════════════════════════════════
function ChordPill({token, annotation, currKey, mode, onClick, selected}) {
  const {display, sub, type} = resolveChord(token, currKey);
  const nameText = mode==='numerals'?token:display;
  const subText  = mode==='numerals'?'':sub;
  return h('div', {
    onClick,
    className: `chord-pill t-${type}${selected?' sel':''}`,
    style:{position:'relative'}
  },
    h('span',{className:'ch-name'},nameText),
    subText && h('span',{className:'ch-sub'},subText),
    annotation && h('span',{style:{fontSize:'.5rem',color:'rgba(255,244,234,.55)',fontStyle:'italic',marginTop:1,lineHeight:1,maxWidth:60,textAlign:'center',display:'block'}},annotation)
  );
}

// ═══════════════════════════════════════
// CHORD EDITOR
// ═══════════════════════════════════════
function ChordEditor({token, annotation, currKey, onApply, onDelete, onClose}) {
  const [val, setVal] = useState(token);
  const [note, setNote] = useState(annotation||'');
  const inpRef = useRef();
  const {display} = resolveChord(val.trim()||token, currKey);
  useEffect(()=>{setTimeout(()=>{inpRef.current?.focus();inpRef.current?.select();},40);},[]);
  return h('div',{className:'editor-popup'},
    h('div',{className:'ed-preview'},display),
    h('div',{className:'ed-label'},'Numeral Code'),
    h('input',{ref:inpRef,className:'ed-input',value:val,placeholder:'e.g. 6m  2#m  6/7  2dim',
      onChange:e=>setVal(e.target.value),
      onKeyDown:e=>{if(e.key==='Enter')onApply(val.trim(),note.trim());if(e.key==='Escape')onClose();}}),
    h('div',{className:'ed-label'},'Annotation (optional)'),
    h('input',{className:'ed-input',value:note,placeholder:'e.g. staccato, repeat…',
      style:{marginBottom:'.5rem'},
      onChange:e=>setNote(e.target.value),
      onKeyDown:e=>{if(e.key==='Enter')onApply(val.trim(),note.trim());if(e.key==='Escape')onClose();}}),
    ...QUICK_GROUPS.map(g=>h('div',{key:g.label},
      h('div',{className:'ed-group-lbl'},g.label),
      h('div',{className:'ed-grid'},
        ...g.tokens.map(t=>h('button',{key:t,className:`ed-opt${val===t?' on':''}`,onClick:()=>setVal(t)},t))
      )
    )),
    h('div',{className:'ed-actions'},
      h('button',{className:'ed-del',onClick:onDelete},'Delete'),
      h('button',{className:'ed-ok',onClick:()=>onApply(val.trim(),note.trim())},'Apply ↵')
    )
  );
}

function PasscodeDialog({onSubmit, onCancel}) {
  const [pass, setPass] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const ref = useRef();
  useEffect(()=>{ setTimeout(()=>ref.current&&ref.current.focus(),50); },[]);
  const go = async () => {
    if (!pass.trim()) return;
    setBusy(true); setErr('');
    const e = await onSubmit(pass.trim());
    setBusy(false);
    if (e) setErr(e);
  };
  return h('div',{className:'confirm-overlay',onClick:onCancel},
    h('div',{className:'confirm-box',onClick:e=>e.stopPropagation()},
      h('h3',{},'Editor login'),
      h('p',{},'Enter the editor passcode to change songs and setlists. Everyone else can still view and use all the charts.'),
      h('input',{ref,className:'ed-input pass-input',type:'password',value:pass,placeholder:'Passcode',autoComplete:'current-password',
        onChange:e=>setPass(e.target.value),onKeyDown:e=>{ if(e.key==='Enter') go(); if(e.key==='Escape') onCancel(); }}),
      err && h('div',{className:'pass-err'},err),
      h('div',{className:'confirm-btns'},
        h('button',{className:'confirm-cancel',onClick:onCancel},'Cancel'),
        h('button',{className:'confirm-ok',onClick:go,disabled:busy},busy?'Checking…':'Log in')
      )
    )
  );
}

function ConflictDialog({onLoad, onOverwrite, onCancel}) {

      h('p',{},'Another editor saved changes after you opened the site. Load their version (your unsaved edits will be lost) or overwrite it with yours.'),

        h('button',{className:'confirm-cancel',onClick:onCancel},'Cancel'),

      )

  );
}

// ═══════════════════════════════════════
// SONG VIEW PAGE
// ═══════════════════════════════════════
const STAGE_SIZES = [1,1.25,1.5,1.8,2.2];

function SongPage({songId, songs, setSongs, keysMap, setKeysMap, onBack, onResetSong, canEdit, dirty, onSave, ctx, startStage}) {
  const songIdx = songs.findIndex(s=>s.id===songId);
  const song = songs[songIdx];
  const inSet = !!(ctx && ctx.item);
  const [tmpKey, setTmpKey] = useState(null);
  const [stage, setStage] = useState(!!startStage);
  const [scrolling, setScrolling] = useState(false);
  const [speed, setSpeed] = useState(4);
  const [sizeIdx, setSizeIdx] = useState(1);
  const [mode, setMode] = useState('chords');
  const [activeEd, setActiveEd] = useState(null);
  const [showKeyDd, setShowKeyDd] = useState(false);
  const [saved, setSaved] = useState(false);
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const [showLyrics, setShowLyrics] = useState(true);
  const [lyrEd, setLyrEd] = useState(null);
  const hasLyrics = song.sections.some(x=>x.lyrics&&x.lyrics.trim());
  const ro = !canEdit || stage;

  const ctxKey = inSet ? ctx.setlist.id+':'+ctx.index : '';
  const baseKey = keysMap[songId] || song.defaultKey;
  const currKey = inSet ? (tmpKey || ctx.item.key || song.defaultKey) : baseKey;
  const scale = DIATONIC[currKey]||DIATONIC.C;
  const setCurrKey = k => {
    if (inSet) { if (canEdit) ctx.onItemKey(k); else setTmpKey(k); }
    else setKeysMap(prev=>({...prev,[songId]:k}));
  };
  const stepKey = dir => {
    const i = KEY_CYCLE.indexOf(currKey);
    setCurrKey(KEY_CYCLE[(i+dir+KEY_CYCLE.length)%KEY_CYCLE.length]);
  };

  // reset view state when the song (or setlist position) changes
  useEffect(()=>{ setTmpKey(null); setActiveEd(null); setLyrEd(null); setScrolling(false); window.scrollTo(0,0); },[songId,ctxKey]);

  useEffect(()=>{
    const handler=e=>{
      if(!e.target.closest('.chord-pill-wrap')&&!e.target.closest('.editor-popup'))setActiveEd(null);
      if(!e.target.closest('.key-picker-rel'))setShowKeyDd(false);
    };
    document.addEventListener('mousedown',handler);
    return ()=>document.removeEventListener('mousedown',handler);
  },[]);

  // stage mode: keep the screen awake
  useEffect(()=>{
    if (!stage) return;
    let lock=null;
    const req=async()=>{ try{ if('wakeLock' in navigator) lock=await navigator.wakeLock.request('screen'); }catch(e){} };
    req();
    const vis=()=>{ if(document.visibilityState==='visible') req(); };
    document.addEventListener('visibilitychange',vis);
    return ()=>{ document.removeEventListener('visibilitychange',vis); try{ lock&&lock.release(); }catch(e){} };
  },[stage]);

  // stage mode: auto-scroll
  useEffect(()=>{
    if (!stage||!scrolling) return;
    let raf, last=performance.now(), acc=0;
    const tick=now=>{
      const dt=(now-last)/1000; last=now;
      acc+=speed*9*dt;
      if (acc>=1) { const px=Math.floor(acc); window.scrollBy(0,px); acc-=px; }
      if (window.innerHeight+window.scrollY >= document.documentElement.scrollHeight-2) { setScrolling(false); return; }
      raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    const pause=e=>{ if(e.target&&e.target.closest&&e.target.closest('.stage-dock')) return; setScrolling(false); };
    window.addEventListener('wheel',pause,{passive:true});
    window.addEventListener('touchstart',pause,{passive:true});
    return ()=>{ cancelAnimationFrame(raf); window.removeEventListener('wheel',pause); window.removeEventListener('touchstart',pause); };
  },[stage,scrolling,speed]);

  // stage mode: keyboard (Esc = exit, Space = start/stop scrolling)
  useEffect(()=>{
    if (!stage) return;
    const onKey=e=>{
      if (e.key==='Escape') { setStage(false); setScrolling(false); }
      else if (e.key===' ' && !/INPUT|TEXTAREA/.test(e.target.tagName)) { e.preventDefault(); setScrolling(v=>!v); }
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[stage]);

  const upd = fn => setSongs(prev=>{
    const n=JSON.parse(JSON.stringify(prev));
    fn(n[songIdx]);
    return n;
  });

  const isActive=(si,ri,ci)=>activeEd&&activeEd.si===si&&activeEd.ri===ri&&activeEd.ci===ci;

  const applyChord=(si,ri,ci,v,note)=>{ upd(s=>{s.sections[si].rows[ri][ci]=note?{t:v,note}:v;}); setActiveEd(null); };
  const delChord=(si,ri,ci)=>{ upd(s=>{s.sections[si].rows[ri].splice(ci,1);if(!s.sections[si].rows[ri].length)s.sections[si].rows.splice(ri,1);}); setActiveEd(null); };
  const addChord=(si,ri)=>upd(s=>s.sections[si].rows[ri].push('1'));
  const addRow=si=>upd(s=>s.sections[si].rows.push(['1']));
  const delRow=(si,ri)=>upd(s=>{s.sections[si].rows.splice(ri,1);if(!s.sections[si].rows.length)s.sections[si].rows.push(['1']);});
  const addSection=()=>{const n=prompt('Section name:','New Section');if(n)upd(s=>s.sections.push({id:_nextId++,name:n.trim(),repeat:null,rows:[['1','4','5']]}));};
  const delSection=si=>{if(confirm(`Remove "${song.sections[si].name}"?`))upd(s=>s.sections.splice(si,1));};
  const editRepeat=si=>{ if(!canEdit) return; const v=prompt('Repeat label (empty to remove):',song.sections[si].repeat||'');if(v!==null)upd(s=>s.sections[si].repeat=v.trim()||null);};
  const addTag=()=>{ const t=(prompt('New tag (e.g. Misa, Natal, Pop):','')||'').trim().slice(0,24); if(t) upd(s=>{ s.tags=s.tags||[]; if(!s.tags.some(x=>x.toLowerCase()===t.toLowerCase())) s.tags.push(t); }); };
  const delTag=t=>upd(s=>{ s.tags=(s.tags||[]).filter(x=>x!==t); });

  const doSave=async()=>{
    const k=keysMap[songId];
    // saving from a song page also makes the key you are viewing the song's default
    const xf=(!inSet && k && k!==song.defaultKey) ? (list=>list.map(s=>s.id===songId?{...s,defaultKey:k}:s)) : null;
    const ok=await onSave(xf);
    if (ok) {
      if (xf) setKeysMap(prev=>{const n={...prev};delete n[songId];return n;});
      setSaved(true); setTimeout(()=>setSaved(false),2200);
    }
  };

  const handleResetSong=()=>{ setShowResetConfirm(false); onResetSong(songId); };
  const getTA=entry=>typeof entry==='object'&&entry!==null&&entry.t?{token:entry.t,annotation:entry.note||''}:{token:entry,annotation:''};

  const lastIdx = inSet ? ctx.setlist.items.length-1 : 0;
  const speedBtn=(label,val,dec,inc)=>h('div',{className:'dock-group'},
    h('span',{className:'dock-lbl'},label),
    h('button',{className:'dock-mini',onClick:dec,'aria-label':label+' down'},'−'),
    h('span',{className:'dock-val'},val),
    h('button',{className:'dock-mini',onClick:inc,'aria-label':label+' up'},'+')
  );

  return h('div',{className:'song-page'+(stage?' stage':'')+(!canEdit?' ro':''),style:{'--sz':STAGE_SIZES[sizeIdx]}},
    showResetConfirm && h(ConfirmDialog,{
      title:'Reset this song?',
      message:`This will restore "${song.title}" to its original chord data and key. Any edits you made will be lost.`,
      onConfirm:handleResetSong,
      onCancel:()=>setShowResetConfirm(false),
      danger:'Reset Song'
    }),

    // NAV BAR
    h('div',{className:'song-nav'},
      h('button',{className:'back-btn',onClick:onBack},h(Icon,{n:'back'}),h('span',{className:'bk-txt'},inSet?'Setlist':'Songs')),
      h('img',{className:'nav-logo',src:LOGO,alt:'Kosmus Karangpanas'}),
      h('div',{className:'song-nav-title'},song.title),
      h('div',{className:'song-nav-right'},
        h('div',{className:'key-wrap'},
          h('span',{className:'key-lbl'},'Key'),
          h('button',{className:'key-step',onClick:()=>stepKey(-1)},'♭'),
          h('div',{className:'key-picker-rel',style:{position:'relative'}},
            h('button',{className:'key-badge-btn',onClick:()=>setShowKeyDd(v=>!v)},fmt(currKey)),
            showKeyDd&&h('div',{className:'key-dropdown'},
              ...KEY_LIST.map(k=>h('div',{key:k.id,className:`key-opt${k.id===currKey?' active':''}`,onClick:()=>{setCurrKey(k.id);setShowKeyDd(false);}},k.l))
            )
          ),
          h('button',{className:'key-step',onClick:()=>stepKey(1)},'♯'),
        ),
        h('button',{className:'stage-btn',onClick:()=>setStage(true)},h(Icon,{n:'play',fill:true,s:14}),'Stage'),
        canEdit && h('button',{className:'song-reset-btn',onClick:()=>setShowResetConfirm(true)},'Reset'),
        canEdit && h('button',{className:`save-btn${saved?' saved':''}${dirty&&!saved?' dirty':''}`,onClick:doSave},saved?'Saved':'Save'),
      )
    ),

    // CONTENT
    h('div',{className:'song-content'},
      inSet && h('div',{className:'set-bar'},
        h('div',{className:'set-bar-info'},
          h('span',{className:'set-bar-name'},ctx.setlist.name||'Setlist'),
          h('span',{className:'set-bar-pos'},`${ctx.index+1} / ${ctx.setlist.items.length}`),
          ctx.item.note && h('span',{className:'set-bar-note'},ctx.item.note)
        ),
        h('div',{className:'set-bar-btns'},
          h('button',{disabled:ctx.index===0,onClick:()=>ctx.goto(ctx.index-1,false)},'‹ Prev'),
          h('button',{disabled:ctx.index>=lastIdx,onClick:()=>ctx.goto(ctx.index+1,false)},'Next ›')
        )
      ),
      h('div',{className:'song-hero'},
        h('h1',{},song.title),
        h('p',{},[song.artist, 'Key of '+fmt(currKey), song.sections.length+' sections'].filter(Boolean).join(' · ')),
        ((song.tags&&song.tags.length)||canEdit) && h('div',{className:'hero-tags'},
          ...(song.tags||[]).map(t=>h('span',{key:t,className:'tag-chip'},t,
            canEdit&&h('button',{className:'tag-x','aria-label':'Remove tag '+t,onClick:()=>delTag(t)},'✕'))),
          canEdit&&h('button',{className:'tag-add',onClick:addTag},'+ tag')
        )
      ),
      h('div',{className:'scale-bar'},
        ...scale.map((n,i)=>h('div',{key:i,className:'scale-card'},
          h('div',{className:'sc-note'},fmt(n)),
          h('div',{className:'sc-deg'},DEG_LABELS[i]),
          h('div',{className:'sc-q'},DEG_Q[i])
        ))
      ),
      h('div',{className:'legend'},
        ...[['#fff12e','Major'],['#ff3d5e','Minor'],['#ff9a1f','Slash/Bass'],['#ff5c8a','Chromatic'],['#ffe0b0','Diminished'],['#fff12e','TUTTI']].map(([c,l])=>
          h('div',{key:l},h('span',{className:'leg-dot',style:{background:c}}),l)
        ),
        canEdit && h('div',{style:{marginLeft:'auto',color:'rgba(255,244,234,.34)',fontSize:'.64rem'}},'tap a chord to edit')
      ),
      h('div',{className:'toolbar'},
        canEdit && h('button',{className:'tb-btn',onClick:addSection},'+ Section'),
        canEdit && h('div',{className:'tb-sep'}),
        ...['chords','numerals','both'].map(m=>h('button',{key:m,className:`tb-btn${mode===m?' on':''}`,onClick:()=>setMode(m)},m.charAt(0).toUpperCase()+m.slice(1))),
        hasLyrics && h('div',{className:'tb-sep'}),
        hasLyrics && h('button',{className:`tb-btn${showLyrics?' on':''}`,onClick:()=>setShowLyrics(v=>!v)},'Lyrics')
      ),

      ...song.sections.map((sec,si)=>
        h('div',{key:sec.id||si,className:'section'},
          h('div',{className:'sec-hdr'},
            ro ? h('span',{className:'sec-name sec-name-ro'},sec.name)
               : h('input',{className:'sec-name',value:sec.name,spellCheck:false,
                   style:{width:Math.max(sec.name.length*9+20,80)},
                   onChange:e=>upd(s=>s.sections[si].name=e.target.value)}),
            (canEdit||sec.repeat) && h('div',{className:`rep-tag${sec.repeat?'':' empty'}`,onClick:()=>ro?null:editRepeat(si)},sec.repeat||'+ repeat'),
            canEdit && h('div',{className:'rep-tag lyr-tag'+(sec.lyrics?'':' empty'),onClick:()=>setLyrEd(lyrEd===si?null:si)},sec.lyrics?'✎ lyrics':'+ lyrics'),
            canEdit && h('button',{className:'del-sec',onClick:()=>delSection(si)},'✕')
          ),
          h('div',{className:'sec-body'},
            ...sec.rows.map((row,ri)=>
              h('div',{key:ri,className:'chord-row'},
                h('span',{className:'row-num'},ri+1),
                ...row.map((entry,ci)=>{
                  const {token,annotation}=getTA(entry);
                  return [
                    ci>0&&h('span',{key:'s'+ci,className:'sep'},'–'),
                    h('div',{key:'c'+ci,className:'chord-pill-wrap',style:{position:'relative'}},
                      h(ChordPill,{token,annotation,currKey,mode,selected:!ro&&isActive(si,ri,ci),
                        onClick:()=>{ if(ro) return; setActiveEd(isActive(si,ri,ci)?null:{si,ri,ci}); }}),
                      !ro&&isActive(si,ri,ci)&&h(ChordEditor,{token,annotation,currKey,
                        onApply:(v,note)=>applyChord(si,ri,ci,v,note),
                        onDelete:()=>delChord(si,ri,ci),
                        onClose:()=>setActiveEd(null)})
                    )
                  ].filter(Boolean);
                }).flat(),
                canEdit && h('button',{className:'add-ch-btn',title:'Add chord',onClick:()=>addChord(si,ri)},'+'),
                canEdit && h('button',{className:'del-row-btn',title:'Remove row',onClick:()=>delRow(si,ri)},'✕')
              )
            ),
            (canEdit && !stage && lyrEd===si)
              ? h('div',{className:'lyr-edit'},
                  h('textarea',{className:'lyr-input',value:sec.lyrics||'',placeholder:'Type or paste the lyrics for this section…',onChange:e=>upd(s=>{s.sections[si].lyrics=e.target.value;})}),
                  h('button',{className:'lyr-done',onClick:()=>setLyrEd(null)},'Done'))
              : ((showLyrics && sec.lyrics && sec.lyrics.trim()) ? h('div',{className:'lyrics'},sec.lyrics) : null),
            canEdit && h('div',{className:'add-row-wrap'},h('button',{className:'add-row-btn',onClick:()=>addRow(si)},'+ add row'))
          )
        )
      ),
      h('div',{className:'song-footer'},`Key of ${fmt(currKey)} · ${scale.map(fmt).join(' · ')} · "7" = ${fmt(scale[4])}/${fmt(scale[6])}`)
    ),

    // STAGE DOCK
    stage && h('div',{className:'stage-dock'},
      h('div',{className:'dock-row'},
        h('button',{className:'dock-btn exit',onClick:()=>{setStage(false);setScrolling(false);}},h(Icon,{n:'x',s:14}),'Exit'),
        inSet && h('button',{className:'dock-btn',disabled:ctx.index===0,onClick:()=>ctx.goto(ctx.index-1,true),'aria-label':'Previous song'},'‹ Prev'),
        h('button',{className:'dock-btn play'+(scrolling?' on':''),onClick:()=>setScrolling(v=>!v)},scrolling?[h(Icon,{key:'i',n:'pause',fill:true,s:14}),'Pause']:[h(Icon,{key:'i',n:'play',fill:true,s:14}),'Scroll']),
        inSet && h('button',{className:'dock-btn',disabled:ctx.index>=lastIdx,onClick:()=>ctx.goto(ctx.index+1,true),'aria-label':'Next song'},'Next ›')
      ),
      h('div',{className:'dock-row'},
        speedBtn('Speed',speed,()=>setSpeed(v=>Math.max(1,v-1)),()=>setSpeed(v=>Math.min(10,v+1))),
        speedBtn('Size',sizeIdx+1,()=>setSizeIdx(v=>Math.max(0,v-1)),()=>setSizeIdx(v=>Math.min(STAGE_SIZES.length-1,v+1))),
        h('div',{className:'dock-group'},
          h('span',{className:'dock-lbl'},'Key'),
          h('button',{className:'dock-mini',onClick:()=>stepKey(-1),'aria-label':'Key down'},'♭'),
          h('span',{className:'dock-val key'},fmt(currKey)),
          h('button',{className:'dock-mini',onClick:()=>stepKey(1),'aria-label':'Key up'},'♯')
        )
      )
    )
  );
}

// ═══════════════════════════════════════
// SETLIST DETAIL PAGE
// ═══════════════════════════════════════
function SetlistPage({setlist, songs, setSetlists, canEdit, onBack, onOpen, onDeleted, toast}) {
  const [showPick, setShowPick] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const upd = fn => setSetlists(prev=>{ const n=clone(prev); const sl=n.find(x=>x.id===setlist.id); if(sl) fn(sl); return n; });
  const songById = id => songs.find(s=>s.id===id);
  const effKey = it => it.key || (songById(it.songId)||{}).defaultKey || 'C';
  const stepKey = (i,dir) => {
    const cur = KEY_CYCLE.indexOf(effKey(setlist.items[i]));
    const k = KEY_CYCLE[(cur+dir+KEY_CYCLE.length)%KEY_CYCLE.length];
    upd(sl=>{ sl.items[i].key=k; });
  };
  const move = (i,d) => upd(sl=>{ const j=i+d; if(j<0||j>=sl.items.length) return; const t=sl.items[i]; sl.items[i]=sl.items[j]; sl.items[j]=t; });
  const remove = i => upd(sl=>{ sl.items.splice(i,1); });
  const addSong = id => { upd(sl=>{ sl.items.push({songId:id,key:null,note:''}); }); toast('Added'); };

  const url = location.href.split('#')[0] + '#/setlist/' + encodeURIComponent(setlist.id);
  const copyLink = () => {
    const done = () => toast('Link copied');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,()=>prompt('Copy this link:',url));
    else prompt('Copy this link:',url);
  };
  const waText = '*'+(setlist.name||'Setlist')+'*'+(setlist.date?' ('+fmtDate(setlist.date)+')':'')+'\n'+
    setlist.items.map((it,i)=>{ const s=songById(it.songId); return (i+1)+'. '+(s?s.title:'(song removed)')+(s&&s.artist?' – '+s.artist:'')+' ['+fmt(effKey(it))+']'+(it.note?' · '+it.note:''); }).join('\n')+
    '\n\nChord charts: '+url;

  return h('div',{className:'setlist-page'},
    showPick && h(PickSongDialog,{songs,items:setlist.items,onAdd:addSong,onClose:()=>setShowPick(false)}),
    confirmDel && h(ConfirmDialog,{
      title:'Delete this setlist?',message:`"${setlist.name||'Setlist'}" will be removed. The songs themselves are not affected.`,
      onConfirm:()=>{ setConfirmDel(false); onDeleted(setlist.id); },onCancel:()=>setConfirmDel(false),danger:'Delete'
    }),
    h('div',{className:'song-nav'},
      h('button',{className:'back-btn',onClick:onBack},h(Icon,{n:'back'}),h('span',{className:'bk-txt'},'Setlists')),
      h('img',{className:'nav-logo',src:LOGO,alt:'Kosmus Karangpanas'}),
      h('div',{className:'song-nav-title'},setlist.name||'Setlist'),
      canEdit && h('div',{className:'song-nav-right'},

// MENU PAGES (home · songs · setlists · help)
