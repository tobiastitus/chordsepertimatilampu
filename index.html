function MenuPage({songs, setSongs, setlists, keysMap, tab, setTab, onSelectSong, onOpenSetlist, onCreateSetlist, onResetAll, canEdit, mode, editorOk, onLoginClick, onLogout, setupHint, onSetupClick}) {
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const [q, setQ] = useState('');
  const [activeTag, setActiveTag] = useState('');
  const songsRef = useRef(null);

  const scrollToSongs = () => {
    const el = songsRef.current;
    if (el) window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 70, behavior:'smooth'});
  };

  const addSong = () => {
    const title = prompt('Song title:','New Song');
    if(!title) return;
    const artist = prompt('Artist name (optional):','') || '';
    const tagStr = prompt('Tags, separated by commas (optional, e.g. Pop, Misa):','') || '';
    const tags = tagStr.split(',').map(t=>t.trim()).filter(Boolean);
    setSongs(prev=>[...prev,{
      id:'song'+Date.now(),title:title.trim(),artist:artist.trim(),color:'#ff2d4f',tags,
      defaultKey:'C',
      sections:[{id:_nextId++,name:'Verse 1',repeat:null,rows:[['1','4','5','6m']]}]
    }]);
  };
  const delSong = (e,id) => {
    e.stopPropagation();
    const s=songs.find(x=>x.id===id);
    if(confirm(`Remove "${s.title}"?`)) setSongs(prev=>prev.filter(x=>x.id!==id));
  };
  const previewChords = song => {
    const k = keysMap[song.id]||song.defaultKey;
    const row = (song.sections[0] && song.sections[0].rows[0]) || [];
    return row.slice(0,4).map(e=>{
      const t = typeof e==='object'&&e!==null&&e.t ? e.t : e;
      return resolveChord(t,k).display;
    });
  };

  const tagCount = {};
  songs.forEach(s=>(s.tags||[]).forEach(t=>{ tagCount[t]=(tagCount[t]||0)+1; }));
  const allTags = Object.keys(tagCount).sort((a,b)=>tagCount[b]-tagCount[a]||a.localeCompare(b));
  const ql = q.trim().toLowerCase();
  const filtered = songs.filter(s=>{
    if (activeTag && !(s.tags||[]).includes(activeTag)) return false;
    if (!ql) return true;
    return (s.title+' '+(s.artist||'')+' '+(s.tags||[]).join(' ')).toLowerCase().includes(ql);
  });
  const filtering = !!(ql||activeTag);

  const dateBlock = d => {
    if (!d) return h('span',{className:'set-date none'},'—');
    try {
      const dt = new Date(d+'T00:00:00');
      return h('span',{className:'set-date'},
        h('b',{},dt.getDate()),
        h('i',{},dt.toLocaleDateString('id-ID',{month:'short',year:'numeric'})));
    } catch(e){ return h('span',{className:'set-date'},d); }
  };
  const pageHead = (kicker, title, meta, actions) => h('div',{className:'page-head'},
    h('div',{className:'page-head-text'},
      h('div',{className:'kicker'},kicker),
      h('h2',{className:'page-title'},title),
      meta && h('div',{className:'page-meta'},meta)
    ),
    actions && actions.filter(Boolean).length>0 && h('div',{className:'page-actions'},...actions.filter(Boolean))
  );

  const library = h('section',{className:'page-wrap',id:'songs',ref:songsRef},
    pageHead('Chord Book','Songs',
      filtering?`${filtered.length} of ${songs.length} songs`:`${songs.length} ${songs.length===1?'song':'songs'}`,
      [canEdit && h('button',{key:'add',className:'btn primary',onClick:addSong},h(Icon,{n:'plus'}),'Add song'),
       canEdit && h('button',{key:'rst',className:'btn ghost',onClick:()=>setShowResetConfirm(true)},'Reset all')]),
    h('div',{className:'search-row'},
      h('span',{className:'search-ico'},h(Icon,{n:'search',s:18})),
      h('input',{className:'search-input',type:'search',placeholder:'Search title, artist or tag',value:q,onChange:e=>setQ(e.target.value),'aria-label':'Search songs'})
    ),
    allTags.length>0 && h('div',{className:'tag-filters'},
      h('button',{className:'tag-filter'+(activeTag===''?' on':''),onClick:()=>setActiveTag('')},'All'),
      ...allTags.map(t=>h('button',{key:t,className:'tag-filter'+(activeTag===t?' on':''),onClick:()=>setActiveTag(activeTag===t?'':t)},t,h('span',{className:'tf-n'},tagCount[t])))
    ),
    h('div',{className:'board-cols','aria-hidden':'true'},
      h('span',{},'No.'),h('span',{},'Song'),h('span',{className:'c-prev'},'Opens with'),h('span',{},'Key'),h('span',{className:'c-sec'},'Sections'),h('span',{})
    ),
    h('ul',{className:'song-list'},
      ...filtered.map((song,i)=>
        h('li',{key:song.id,style:{animationDelay:(Math.min(i,12)*35)+'ms'}},
          h('div',{className:'song-row',role:'button',tabIndex:0,
            onClick:()=>onSelectSong(song.id),
            onKeyDown:e=>{ if((e.key==='Enter'||e.key===' ')&&e.target===e.currentTarget){e.preventDefault();onSelectSong(song.id);} }},
            h('span',{className:'row-idx'},pad2(i+1)),
            h('span',{className:'row-main'},
              h('span',{className:'row-title'},song.title),
              h('span',{className:'row-artist'},[song.artist,...(song.tags||[])].filter(Boolean).join(' · '))
            ),
            h('span',{className:'row-prev'},...previewChords(song).map((c,j)=>h('span',{key:j,className:'mini-chord'},c))),
            h('span',{className:'row-key'},h('span',{className:'key-chip'},fmt(keysMap[song.id]||song.defaultKey))),
            h('span',{className:'row-sec'},`${song.sections.length}`,h('em',{},' sections')),
            h('span',{className:'row-end'},
              canEdit && h('button',{className:'song-del',onClick:e=>delSong(e,song.id),title:'Remove song','aria-label':'Remove '+song.title},h(Icon,{n:'x',s:14})),
              h('span',{className:'row-go','aria-hidden':'true'},h(Icon,{n:'arrow',s:18}))
            )
          )
        )
      )
    ),
    filtered.length===0 && h('div',{className:'empty-note'},
      'No songs match your search. ',
      h('button',{className:'link-btn',onClick:()=>{setQ('');setActiveTag('');}},'Clear filters'))
  );

  const setlistSection = h('section',{className:'page-wrap'},
    pageHead('Plan an event','Setlist',`${setlists.length} ${setlists.length===1?'setlist':'setlists'}`,
      [canEdit && h('button',{key:'new',className:'btn primary',onClick:onCreateSetlist},h(Icon,{n:'plus'}),'New setlist')]),
    h('ul',{className:'song-list'},
      ...setlists.map((sl,i)=>{
        const titles = sl.items.map(it=>(songs.find(s=>s.id===it.songId)||{}).title).filter(Boolean);
        return h('li',{key:sl.id,style:{animationDelay:(Math.min(i,12)*35)+'ms'}},
          h('div',{className:'song-row set-row',role:'button',tabIndex:0,onClick:()=>onOpenSetlist(sl.id),
            onKeyDown:e=>{ if((e.key==='Enter'||e.key===' ')&&e.target===e.currentTarget){e.preventDefault();onOpenSetlist(sl.id);} }},
            dateBlock(sl.date),
            h('span',{className:'row-main'},
              h('span',{className:'row-title'},sl.name||'Untitled setlist'),
              h('span',{className:'row-artist'},titles.length?titles.join(' · '):'No songs yet')
            ),
            h('span',{className:'row-sec'},`${sl.items.length}`,h('em',{},sl.items.length===1?' song':' songs')),
            h('span',{className:'row-go','aria-hidden':'true'},h(Icon,{n:'arrow',s:18}))
          )
        );
      })
    ),
    setlists.length===0 && h('div',{className:'empty-note'},canEdit?'No setlists yet. Create one for your next event.':'No setlists yet. Setlists made by editors will appear here.')
  );

  return h('div',{className:'menu-page'+(tab==='home'?' is-home':'')},
    showResetConfirm && h(ConfirmDialog,{
      title:'Reset all songs?',
      message: mode==='local'
        ? 'This will restore all songs and keys to their original defaults. All your edits and added songs will be permanently lost.'
        : 'This restores every song to the built-in original. Nothing changes for other people until you press Save.',
      onConfirm:()=>{setShowResetConfirm(false);onResetAll();},
      onCancel:()=>setShowResetConfirm(false),
      danger:'Reset everything'
    }),
    h(TopNav,{tab,setTab,mode,editorOk,onLoginClick,onLogout,setupHint,onSetupClick}),
    tab==='home' && h(Hero,{onScrollDown:scrollToSongs}),
    (tab==='home'||tab==='songs') && library,
    tab==='setlists' && setlistSection,
    tab==='about' && h('section',{className:'page-wrap'},
      pageHead('Help','How it works',null,null),
      h(AboutPage,{})
    ),
    h('footer',{className:'site-footer'},
      h('img',{src:LOGO,alt:''}),
      h('span',{},'Kosmus Karangpanas · Semarang')
    )
  );
}

// ═══════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════
function App() {
  const boot = useRef(null);
  if (!boot.current) boot.current = initialApp();
  const b = boot.current;

  const [mode, setMode] = useState(b.mode);            // loading | local | shared | offline
  const [songs, setSongs] = useState(b.songs);
  const [setlists, setSetlists] = useState(b.setlists);
  const [snapshot, setSnapshot] = useState(b.snapshot);
  const seenRef = useRef(b.seen);
  const versionRef = useRef(b.version);
  const [keysMap, setKeysMap] = useState(()=> lsGet(KEYS_KEY) || (lsGet(STORE_KEY)||{}).keys || {});
  const [editorPass, setEditorPass] = useState(()=>{ try{ return localStorage.getItem(EDITOR_KEY)||''; }catch(e){ return ''; } });
  const [editorOk, setEditorOk] = useState(false);
  const [route, setRoute] = useState(parseHash);
  const [toastMsg, setToastMsg] = useState('');
  const [showLogin, setShowLogin] = useState(false);
  const [conflict, setConflict] = useState(false);
  const [saving, setSaving] = useState(false);
  const [setupHint, setSetupHint] = useState(null);
  const [showSetup, setShowSetup] = useState(false);
  const toastTimer = useRef(null);

  const canEdit = mode==='local' || (mode==='shared' && editorOk);
  const docStr = React.useMemo(()=>snap(songs,setlists),[songs,setlists]);
  const dirty = canEdit && snapshot!==null && docStr!==snapshot;

  const modeRef = useRef(mode); modeRef.current = mode;
  const dirtyRef = useRef(dirty); dirtyRef.current = dirty;

  const toast = useCallback(msg=>{
    setToastMsg(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(()=>setToastMsg(''),2800);
  },[]);

  const applyState = (st, version) => {
    setSongs(st.songs); setSetlists(st.setlists);
    seenRef.current = st.seen; versionRef.current = version;
    setSnapshot(snap(st.songs,st.setlists));
  };
  const goLocal = () => { applyState(buildState(lsGet(STORE_KEY)),0); setMode('local'); };

  // fetch the shared copy from the server
  const refresh = useCallback(async (opts={})=>{
    try {
      const r = await fetch('/api/data',{cache:'no-store'});
      let j=null; try{ j=await r.json(); }catch(e){}
      if (r.status===404 || (r.ok && !j)) { if (opts.initial) goLocal(); return; }
      if (!r.ok || !j) throw new Error('bad response');
      if (!j.configured) { if (opts.initial) { setSetupHint({passcodeSet:!!j.passcodeSet}); goLocal(); } return; }
      if (!opts.initial && !opts.force) {
        if (dirtyRef.current) return;
        if (modeRef.current==='shared' && j.version===versionRef.current) return;
      }
      applyState(buildState(j.data), j.version||0);
      lsSet(CACHE_KEY,{version:j.version||0,data:j.data});
      setMode('shared');
    } catch(e) {
      if (modeRef.current==='loading') { applyState(buildState(null),0); setMode('offline'); }
      else if (opts.initial) setMode('offline');
    }
  },[]);

  useEffect(()=>{ if (modeRef.current!=='local') refresh({initial:true}); },[]);
  useEffect(()=>{
    const onVis = ()=>{ if(!document.hidden && modeRef.current!=='local' && modeRef.current!=='loading') refresh({}); };
    document.addEventListener('visibilitychange',onVis);
    window.addEventListener('focus',onVis);
    return ()=>{ document.removeEventListener('visibilitychange',onVis); window.removeEventListener('focus',onVis); };
  },[]);

  // quietly confirm a remembered editor passcode
  useEffect(()=>{
    if (mode!=='shared' || !editorPass || editorOk) return;
    let off=false;
    apiPost({action:'verify',passcode:editorPass}).then(res=>{
      if (off) return;
      if (res.ok) setEditorOk(true);
      else if (res.status===401) { try{localStorage.removeItem(EDITOR_KEY);}catch(e){} setEditorPass(''); }
    });
    return ()=>{ off=true; };
  },[mode,editorPass,editorOk]);

  useEffect(()=>{ lsSet(KEYS_KEY,keysMap); },[keysMap]);

  // opening a link to a setlist we do not have yet (e.g. just shared) -> fetch the latest copy
  useEffect(()=>{
    if (modeRef.current==='local' || modeRef.current==='loading') return;
    const missingSet = (route.page==='setlist' || route.setId) && !setlists.find(x=>x.id===route.setId);
    if (missingSet) refresh({});
  },[route.page,route.setId]);
  // light background refresh so members see new songs/setlists without reloading
  useEffect(()=>{
    const t = setInterval(()=>{ if(!document.hidden && modeRef.current==='shared') refresh({}); }, 90000);
    return ()=>clearInterval(t);
  },[]);

  useEffect(()=>{
    const onHash = () => setRoute(parseHash());
    window.addEventListener('hashchange', onHash);
    return ()=>window.removeEventListener('hashchange', onHash);
  },[]);
  useEffect(()=>{ window.scrollTo(0,0); },[route.page,route.tab,route.setId]);

  useEffect(()=>{
    const warn = e => { if (dirtyRef.current) { e.preventDefault(); e.returnValue=''; } };
    window.addEventListener('beforeunload',warn);
    return ()=>window.removeEventListener('beforeunload',warn);
  },[]);

  const handleSetSongs = useCallback(fn=>{ setSongs(prev => typeof fn==='function' ? fn(prev) : fn); },[]);
  const handleSetSetlists = useCallback(fn=>{ setSetlists(prev => typeof fn==='function' ? fn(prev) : fn); },[]);

  const discard = () => {
    if (!snapshot) return;
    const d = JSON.parse(snapshot);
    setSongs(d.songs); setSetlists(d.setlists);
  };

  const login = async pass => {
    const res = await apiPost({action:'verify',passcode:pass});
    if (res.ok) {
      try{localStorage.setItem(EDITOR_KEY,pass);}catch(e){}
      setEditorPass(pass); setEditorOk(true); setShowLogin(false); toast('Editor mode is on');
      return null;
    }
    if (res.status===401) return 'Wrong passcode.';
    if (res.status===503) return (res.json&&res.json.error)||'The editor passcode is not set up on the server yet.';
    return 'Could not reach the server. Try again.';
  };
  const logout = () => {
    if (dirty && !confirm('You have unsaved changes. Log out and discard them?')) return;
    if (dirty) discard();
    try{localStorage.removeItem(EDITOR_KEY);}catch(e){}
    setEditorPass(''); setEditorOk(false); toast('Editor mode is off');
  };

  const save = useCallback(async (xf, force)=>{
    if (saving) return false;
    const nextSongs = xf ? xf(songs) : songs;
    if (xf) setSongs(nextSongs);
    const data = {songs:nextSongs,setlists,seen:seenRef.current};
    if (modeRef.current==='local') {
      const ok = lsSet(STORE_KEY,{...data,keys:keysMap});
      if (ok) { setSnapshot(snap(nextSongs,setlists)); toast('Saved on this device'); }
      else toast('Could not save in this browser');
      return ok;
    }
    setSaving(true);
    const res = await apiPost({action:'save',passcode:editorPass,baseVersion:versionRef.current,force:!!force,data});
    setSaving(false);
    if (res.ok) {
      versionRef.current = res.json.version;
      setSnapshot(snap(nextSongs,setlists));
      lsSet(CACHE_KEY,{version:res.json.version,data});
      toast('Saved for everyone ✓');
      return true;
    }
    if (res.status===409) { setConflict(true); return false; }
    if (res.status===401) { try{localStorage.removeItem(EDITOR_KEY);}catch(e){} setEditorPass(''); setEditorOk(false); toast('Passcode no longer valid — please log in again'); return false; }
    toast((res.json&&res.json.error)||'Could not save. Check your connection and try again.');
    return false;
  },[songs,setlists,keysMap,editorPass,saving,toast]);

  const handleResetAll = () => {
    const defaults = clone(SONGS_DEFAULT);
    setSongs(defaults); setKeysMap({});
    if (modeRef.current==='local') {
      lsSet(STORE_KEY,{songs:defaults,setlists,seen:seenRef.current,keys:{}});
      setSnapshot(snap(defaults,setlists)); toast('Reset to defaults');
    } else toast('Reset — press Save to publish for everyone');
  };
  const handleResetSong = songId => {
    const original = SONGS_DEFAULT.find(s=>s.id===songId);
    if (original) {
      setSongs(prev=>prev.map(s=>s.id===songId?clone(original):s));
      setKeysMap(prev=>{ const n={...prev}; delete n[songId]; return n; });
    }
  };

  const createSetlist = () => {
    const name = prompt('Setlist name (e.g. Misa Minggu 26 Okt):','New setlist');
    if (!name) return;
    const id = 'sl'+Date.now();
    setSetlists(prev=>[{id,name:name.trim(),date:todayStr(),items:[]},...prev]);
    setHash('setlist/'+id);
  };

  if (mode==='loading') return h(LoadingScreen,{});

  const sharedBits = [
    mode==='offline' && h('div',{key:'off',className:'status-banner'},'Offline — showing the last saved copy. Editing is paused until the connection is back.'),
    toastMsg && h('div',{key:'toast',className:'toast',role:'status'},toastMsg),
    showSetup && h(ConfirmDialog,{key:'setup',
      title:'Shared saving is not set up yet',
      message:'The website cannot find its database'+(setupHint&&!setupHint.passcodeSet?' or the editor passcode':'')+', so edits are only saved on this device. In Vercel, connect the Upstash Redis database to this project'+(setupHint&&!setupHint.passcodeSet?', add the EDITOR_PASSCODE setting':'')+' and press Redeploy (README, Part 3).',
      onConfirm:()=>setShowSetup(false), onCancel:()=>setShowSetup(false), danger:'OK'}),
    showLogin && h(PasscodeDialog,{key:'login',onSubmit:login,onCancel:()=>setShowLogin(false)}),
    conflict && h(ConflictDialog,{key:'conf',
      onLoad:()=>{ setConflict(false); refresh({force:true}).then(()=>toast('Loaded the latest version')); },
      onOverwrite:()=>{ setConflict(false); save(null,true); },
      onCancel:()=>setConflict(false)}),
    dirty && route.page!=='song' && h('div',{key:'dirty',className:'dirty-bar'},
      h('span',{className:'dirty-dot'}),
      h('span',{className:'dirty-text'},'Unsaved changes'),
      h('button',{className:'dirty-btn',disabled:saving,onClick:()=>save()},saving?'Saving…':(mode==='local'?'Save':'Save for everyone')),
      h('button',{className:'dirty-discard',onClick:()=>{ if(confirm('Discard all unsaved changes?')) discard(); }},'Discard')
    )
  ].filter(Boolean);

  let page = null;

  if (route.page==='song' && songs.find(s=>s.id===route.songId)) {
    let ctx = null;
    if (route.setId) {
      const sl = setlists.find(x=>x.id===route.setId);
      if (sl && sl.items[route.index] && sl.items[route.index].songId===route.songId) {
        ctx = {
          setlist:sl, index:route.index, item:sl.items[route.index],
          onItemKey:k=>setSetlists(prev=>{ const n=clone(prev); const x=n.find(y=>y.id===route.setId); if(x&&x.items[route.index]) x.items[route.index].key=k; return n; }),
          goto:(i,stg)=>{ const it=sl.items[i]; if(it) setHash(`song/${it.songId}/in/${sl.id}/${i}`+(stg?'?stage=1':'')); }
        };
      }
    }
    page = h(SongPage,{
      songId:route.songId, songs, setSongs:handleSetSongs, keysMap, setKeysMap,
      onBack:()=>{ if (route.setId && ctx) setHash('setlist/'+route.setId); else setHash('songs'); },
      onResetSong:handleResetSong, canEdit, dirty, onSave:save, ctx, startStage:route.stage
    });
  } else if (route.page==='setlist' && setlists.find(x=>x.id===route.setId)) {
    const sl = setlists.find(x=>x.id===route.setId);
    page = h(SetlistPage,{
      setlist:sl, songs, setSetlists:handleSetSetlists, canEdit, toast,
      onBack:()=>setHash('setlists'),
      onOpen:(i,stg)=>{ const it=sl.items[i]; if(it) setHash(`song/${it.songId}/in/${sl.id}/${i}`+(stg?'?stage=1':'')); },
      onDeleted:id=>{ setSetlists(prev=>prev.filter(x=>x.id!==id)); setHash('setlists'); }
    });
  } else {
    const tab = route.page==='menu' ? route.tab : (route.page==='setlist'?'setlists':'home');
    page = h(MenuPage,{
      songs, setSongs:handleSetSongs, setlists, keysMap, tab,
      setTab:t=>setHash(t==='home'?'':t),
      onSelectSong:id=>setHash('song/'+id),
      onOpenSetlist:id=>setHash('setlist/'+id),
      onCreateSetlist:createSetlist,
      onResetAll:handleResetAll, canEdit, mode, editorOk,
      onLoginClick:()=>setShowLogin(true), onLogout:logout, setupHint, onSetupClick:()=>setShowSetup(true)
    });
  }

  return h(React.Fragment,null,page,...sharedBits);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
