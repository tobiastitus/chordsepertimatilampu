<title>Kosmus Karangpanas - Chord Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #120609;
  --ink: #fff4ea;
  --mute: rgba(255,244,234,.58);
  --faint: rgba(255,244,234,.34);
  --line: rgba(255,255,255,.10);
  --glass: rgba(255,255,255,.045);
  --acid: #fff12e;
  --mint: #ff3d5e;
  --sky: #ff9a1f;
  --coral: #ff2d4f;
  --violet: #ffe0b0;
  --panel: #210a10;
  --display: 'Outfit', 'DM Sans', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background:
    radial-gradient(60% 50% at 78% 18%, rgba(255,38,70,.30), transparent 62%),
    radial-gradient(55% 45% at 12% 88%, rgba(170,10,35,.34), transparent 60%),
    radial-gradient(40% 40% at 92% 92%, rgba(255,241,46,.09), transparent 65%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font-family: 'DM Sans', -apple-system, sans-serif;
  min-height: 100vh;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
/* film grain, echoing the soft photographic reference */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
#root { position: relative; z-index: 1; }
button, input { font-family: inherit; }
::selection { background: var(--acid); color: #120609; }
:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

/* ═══════════ SHARED PILLS ═══════════ */
.pill {
  border: none; background: var(--acid); color: #120609;
  font-weight: 600; font-size: .74rem; letter-spacing: .04em; text-transform: uppercase;
  padding: .55rem 1.05rem; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: center; gap: .5rem;
  transition: background .2s, color .2s, box-shadow .2s, transform .15s; white-space: nowrap;
}
.pill:hover { background: #fff; }
.pill:active { transform: scale(.97); }
.pill.active { background: #000; color: var(--acid); }
.pill.active::before { content:''; width: 6px; height: 6px; border-radius: 50%; background: var(--acid); }
.pill.ghost { background: transparent; color: var(--acid); box-shadow: inset 0 0 0 2px var(--acid); }
.pill.ghost:hover { background: var(--acid); color: #120609; }

/* ═══════════ MENU PAGE ═══════════ */
.menu-page {
  min-height: 100vh; display: flex; flex-direction: column;
  padding: clamp(1rem,3vw,2rem) clamp(1rem,4vw,3rem) 7rem;
  max-width: 1280px; margin: 0 auto;
}
.menu-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1.2rem; flex-wrap: wrap; }
.brand-name {
  font-family: var(--display); font-weight: 400; color: var(--acid);
  font-size: clamp(2.6rem, 7.5vw, 5.2rem); line-height: .92; letter-spacing: -.045em;
}
.brand-tag { margin: .9rem 0 0 .25rem; font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--acid); opacity: .85; }
.pill-nav { display: flex; gap: .3rem; flex-wrap: wrap; }

.menu-main {
  flex: 1; display: grid; grid-template-columns: minmax(230px, 1fr) minmax(0, 1.5fr);
  gap: clamp(1.5rem,4vw,4rem); align-items: end; margin-top: clamp(2rem, 7vh, 5rem);
}
.focus-panel { max-width: 380px; animation: fadeIn .35s ease; align-self: end; padding-bottom: .6rem; }
.focus-kicker { font-size: .64rem; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); margin-bottom: .6rem; }
.focus-title { font-family: var(--display); font-size: 1.9rem; font-weight: 500; letter-spacing: -.03em; line-height: 1.05; color: #fff; }
.focus-artist { margin-top: .35rem; color: var(--mute); font-size: .9rem; }
.focus-meta { margin: 1rem 0 .7rem; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--acid); }
.focus-chips { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: 1.3rem; }
.focus-chip { font-family: var(--display); font-weight: 600; font-size: .95rem; padding: .28rem .7rem; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid var(--line); }

.song-list { list-style: none; display: flex; flex-direction: column; gap: .15rem; min-width: 0; }
.song-list li { animation: rise .5s ease both; }
.song-item {
  display: flex; align-items: center; gap: .65rem; cursor: pointer; position: relative;
  font-family: var(--display); font-weight: 500; text-transform: uppercase;
  font-size: clamp(1.7rem, 4.6vw, 3.2rem); line-height: 1.02; letter-spacing: -.035em;
  color: rgba(255,241,46,.48); transition: color .25s, transform .25s; padding: .12rem 0; border-radius: 10px;
}
.song-item .dot { width: .26em; height: .26em; border-radius: 50%; background: #fff; flex-shrink: 0; opacity: 0; transform: scale(0); transition: .25s; }
.song-item.active { color: #fff; transform: translateX(4px); }
.song-item.active .dot { opacity: 1; transform: scale(1); }
.item-text { display: flex; flex-wrap: wrap; align-items: flex-start; gap: .15rem .6rem; min-width: 0; }
.key-sup {
  font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: .7rem; letter-spacing: .06em; letter-spacing: .06em;
  color: var(--acid); border: 1px solid currentColor; border-radius: 999px; padding: .08rem .55rem; margin-top: .45rem; line-height: 1.4;
}
.item-artist { display: none; width: 100%; font-family: 'DM Sans', sans-serif; font-size: .8rem; font-weight: 400; letter-spacing: .02em; text-transform: none; color: var(--mute); }
.song-del {
  margin-left: auto; background: none; border: none; color: rgba(255,255,255,.3); font-size: .85rem;
  cursor: pointer; padding: .4rem .6rem; border-radius: 999px; opacity: 0; transition: .2s;
}
.song-item:hover .song-del, .song-item.active .song-del, .song-del:focus-visible { opacity: 1; }
.song-del:hover { color: #120609; background: var(--coral); }
@media (hover: none) { .song-del { opacity: .55; } }

.menu-actions {
  position: fixed; left: clamp(1rem,4vw,3rem); right: clamp(1rem,4vw,3rem); bottom: 1.2rem; z-index: 50;
  display: flex; justify-content: space-between; align-items: center; pointer-events: none;
}
.menu-actions > * { pointer-events: auto; }
.menu-actions .pill.ghost { background: rgba(18,6,9,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.menu-actions .pill.ghost:hover { background: var(--acid); }
.reset-btn {
  background: rgba(18,6,9,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--line); color: var(--mute); padding: .5rem 1rem; border-radius: 999px;
  cursor: pointer; font-size: .72rem; font-weight: 500; letter-spacing: .04em; transition: .2s;
}
.reset-btn:hover { border-color: var(--coral); color: var(--coral); }

@media (max-width: 760px) {
  .menu-main { grid-template-columns: 1fr; margin-top: 2rem; }
  .focus-panel { display: none; }
  .item-artist { display: block; }
  .song-item { align-items: flex-start; }
  .song-item .dot { margin-top: .4em; }
  .song-list { gap: .7rem; }
}

/* ═══════════ ABOUT PAGE ═══════════ */
.about-page { max-width: 720px; margin: 2.5rem 0 3rem; animation: fadeIn .3s ease; }
.about-card { background: var(--glass); border: 1px solid var(--line); border-radius: 20px; padding: 1.8rem; margin-bottom: 1rem; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.about-card h2 { font-family: var(--display); font-size: 1.5rem; font-weight: 500; letter-spacing: -.03em; color: var(--acid); margin-bottom: .9rem; }
.about-card p { font-size: .88rem; color: var(--mute); line-height: 1.7; margin-bottom: .6rem; }
.about-card p:last-child { margin-bottom: 0; }
.about-card ul { padding-left: 1.1rem; }
.about-card ul li { font-size: .86rem; color: var(--mute); line-height: 1.8; }
.token-table { width: 100%; border-collapse: collapse; font-size: .8rem; margin-top: .4rem; }
.token-table th { text-align: left; padding: .4rem .6rem; font-weight: 600; color: var(--faint); font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; }
.token-table td { padding: .5rem .6rem; border-top: 1px solid var(--line); color: var(--ink); font-family: 'DM Mono', monospace; vertical-align: top; }
.token-table td:first-child { font-weight: 500; color: var(--acid); }
.token-table td:last-child { font-family: 'DM Sans', sans-serif; color: var(--mute); }

/* ═══════════ SONG PAGE ═══════════ */
.song-page { min-height: 100vh; }
.song-nav {
  position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
  padding: .7rem clamp(.8rem,3vw,2rem);
  background: rgba(18,6,9,.74); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.back-btn {
  background: transparent; color: var(--acid); box-shadow: inset 0 0 0 2px var(--acid); border: none;
  padding: .42rem .95rem; border-radius: 999px; cursor: pointer; font-size: .72rem; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; transition: .2s; white-space: nowrap;
}
.back-btn:hover { background: var(--acid); color: #120609; }
.song-nav-title { font-family: var(--display); font-size: 1.05rem; font-weight: 500; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.song-nav-right { margin-left: auto; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }

.key-wrap { display: flex; align-items: center; gap: .25rem; background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 999px; padding: .2rem .25rem .2rem .8rem; }
.key-lbl { font-size: .58rem; color: var(--faint); font-weight: 600; text-transform: uppercase; letter-spacing: .14em; margin-right: .2rem; }
.key-step { background: transparent; border: none; color: var(--ink); width: 1.8rem; height: 1.8rem; border-radius: 50%; cursor: pointer; font-size: .95rem; font-weight: 600; display: flex; align-items: center; justify-content: center; transition: .15s; }
.key-step:hover { background: var(--acid); color: #120609; }
.key-badge-btn { background: var(--acid); color: #120609; font-family: var(--display); font-size: 1rem; font-weight: 700; padding: .2rem .85rem; border-radius: 999px; min-width: 2.9rem; text-align: center; cursor: pointer; border: none; }
.key-dropdown { position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: .55rem; z-index: 500; width: 240px; box-shadow: 0 24px 60px rgba(0,0,0,.5); display: grid; grid-template-columns: repeat(6,1fr); gap: 4px; }
.key-opt { background: rgba(255,255,255,.05); border: 1px solid transparent; color: var(--ink); border-radius: 8px; padding: .38rem .1rem; font-size: .78rem; text-align: center; cursor: pointer; font-family: var(--display); font-weight: 500; transition: .12s; }
.key-opt:hover { border-color: var(--acid); }
.key-opt.active { background: var(--acid); color: #120609; font-weight: 700; }

.save-btn { background: var(--acid); border: none; color: #120609; padding: .5rem 1rem; border-radius: 999px; font-size: .72rem; cursor: pointer; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; transition: .2s; white-space: nowrap; }
.save-btn:hover { background: #fff; }
.save-btn.saved { background: var(--mint); color: #120609; }
.song-reset-btn { background: transparent; border: 1px solid var(--line); color: var(--mute); padding: .48rem .9rem; border-radius: 999px; font-size: .72rem; cursor: pointer; font-weight: 500; letter-spacing: .04em; transition: .2s; white-space: nowrap; }
.song-reset-btn:hover { border-color: var(--coral); color: var(--coral); }

.song-content { padding: 0 clamp(.8rem,3vw,2rem) 5rem; max-width: 1000px; margin: 0 auto; }
.song-hero { padding: clamp(1.5rem,5vw,3.5rem) 0 1.6rem; animation: fadeIn .35s ease; }
.song-hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.4rem, 8vw, 5rem); line-height: .95; letter-spacing: -.045em; color: var(--acid); }
.song-hero p { margin: .8rem .2rem 0; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }

.scale-bar { display: flex; gap: .35rem; margin-bottom: .9rem; flex-wrap: wrap; }
.scale-card { display: flex; flex-direction: column; align-items: center; background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: .35rem .6rem; min-width: 2.7rem; gap: 1px; }
.sc-note { font-family: var(--display); font-size: 1rem; font-weight: 600; color: var(--acid); line-height: 1.1; }
.sc-deg { font-size: .5rem; font-weight: 700; color: var(--sky); letter-spacing: .06em; }
.sc-q { font-size: .48rem; color: var(--faint); font-family: 'DM Mono', monospace; }

.legend { display: flex; flex-wrap: wrap; gap: .35rem 1.2rem; margin-bottom: 1rem; padding: .2rem .1rem; font-size: .66rem; color: var(--mute); letter-spacing: .03em; }
.leg-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

.toolbar { display: flex; gap: .35rem; margin-bottom: 1.1rem; flex-wrap: wrap; align-items: center; }
.tb-btn { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: .42rem .95rem; border-radius: 999px; font-size: .72rem; cursor: pointer; font-weight: 500; letter-spacing: .03em; transition: .15s; white-space: nowrap; }
.tb-btn:hover { border-color: var(--acid); color: var(--acid); }
.tb-btn.on { background: var(--acid); color: #120609; border-color: var(--acid); font-weight: 700; }
.tb-sep { width: 1px; height: 1.3rem; background: var(--line); margin: 0 .2rem; }

.section { background: var(--glass); border: 1px solid var(--line); border-radius: 20px; margin-bottom: .9rem; overflow: visible; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.sec-hdr { border-bottom: 1px solid var(--line); padding: .55rem 1rem; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.sec-name { font-family: var(--display); font-size: .86rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: .15rem .35rem; outline: none; transition: .15s; max-width: 100%; }
.sec-name:hover { border-color: var(--line); }
.sec-name:focus { border-color: var(--acid); background: rgba(255,241,46,.06); }
.rep-tag { font-size: .62rem; font-weight: 700; color: var(--acid); border: 1px solid var(--acid); padding: .1rem .55rem; border-radius: 999px; cursor: pointer; transition: .15s; user-select: none; }
.rep-tag.empty { opacity: .3; border-color: var(--faint); color: var(--mute); }
.rep-tag:hover { background: var(--acid); color: #120609; opacity: 1; border-color: var(--acid); }
.del-sec { margin-left: auto; background: transparent; border: none; color: var(--faint); font-size: .8rem; cursor: pointer; padding: .3rem .5rem; border-radius: 999px; transition: .15s; }
.del-sec:hover { color: #120609; background: var(--coral); }

.sec-body { padding: 1rem 1rem .7rem; display: flex; flex-direction: column; gap: .7rem; }
.chord-row { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; padding: .08rem 0; position: relative; }
.row-num { font-size: .55rem; color: var(--faint); width: .9rem; text-align: right; flex-shrink: 0; font-family: 'DM Mono', monospace; }

.chord-pill {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  padding: .55rem .95rem .5rem; border-radius: 14px; cursor: pointer; min-width: 3.3rem; min-height: 3rem;
  text-align: center; gap: 2px; transition: all .15s; user-select: none;
}
.chord-pill:hover { transform: translateY(-2px); filter: brightness(1.2); }
.chord-pill:active { transform: translateY(0); }
.chord-pill.sel { outline: 2px solid #fff; outline-offset: 2px; }
.chord-pill.t-maj    { background: rgba(255,241,46,.10);  border: 1px solid rgba(255,241,46,.38); }
.chord-pill.t-min    { background: rgba(255,61,94,.10); border: 1px solid rgba(255,61,94,.38); }
.chord-pill.t-slash  { background: rgba(255,154,31,.10); border: 1px solid rgba(255,154,31,.40); }
.chord-pill.t-chrom  { background: rgba(255,92,138,.10); border: 1px solid rgba(255,92,138,.40); }
.chord-pill.t-dim    { background: rgba(255,224,176,.10); border: 1px solid rgba(255,224,176,.40); }
.chord-pill.t-tutti  { background: rgba(255,241,46,.05);  border: 1.5px dashed rgba(255,241,46,.55); }
.chord-pill.t-normal { background: rgba(255,255,255,.05); border: 1px solid var(--line); }
.ch-name { font-family: var(--display); font-size: 1.3rem; font-weight: 600; line-height: 1.1; white-space: nowrap; letter-spacing: -.01em; }
.chord-pill.t-maj .ch-name   { color: var(--acid); }
.chord-pill.t-min .ch-name   { color: var(--mint); }
.chord-pill.t-slash .ch-name { color: var(--sky); }
.chord-pill.t-chrom .ch-name { color: var(--coral); }
.chord-pill.t-dim .ch-name   { color: var(--violet); }
.chord-pill.t-tutti .ch-name { color: var(--acid); font-size: .74rem; letter-spacing: .14em; }
.chord-pill.t-normal .ch-name { color: var(--ink); }
.ch-sub { font-size: .52rem; color: var(--faint); font-family: 'DM Mono', monospace; line-height: 1; margin-top: 1px; }

.sep { color: rgba(255,255,255,.18); font-size: .85rem; user-select: none; flex-shrink: 0; font-weight: 300; }
.add-ch-btn { display: inline-flex; align-items: center; justify-content: center; width: 2rem; height: 3rem; border: 1px dashed var(--line); border-radius: 12px; color: var(--faint); font-size: 1.1rem; cursor: pointer; background: transparent; transition: .15s; }
.add-ch-btn:hover { border-color: var(--acid); color: var(--acid); }
.del-row-btn { display: inline-flex; align-items: center; justify-content: center; width: 1.6rem; height: 3rem; border: none; background: transparent; color: var(--faint); font-size: .75rem; cursor: pointer; transition: .15s; }
.del-row-btn:hover { color: var(--coral); }
.add-row-wrap { display: flex; justify-content: center; margin-top: .25rem; opacity: 0; transition: .2s; }
.section:hover .add-row-wrap, .section:focus-within .add-row-wrap { opacity: 1; }
@media (hover: none) { .add-row-wrap { opacity: 1; } }
.add-row-btn { background: transparent; border: 1px dashed var(--line); color: var(--mute); border-radius: 999px; padding: .2rem 1.4rem; font-size: .62rem; cursor: pointer; transition: .15s; letter-spacing: .08em; text-transform: uppercase; }
.add-row-btn:hover { border-color: var(--acid); color: var(--acid); }

/* ═══════════ CHORD EDITOR ═══════════ */
.editor-popup {
  position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%);
  background: var(--panel); border: 1.5px solid var(--acid); border-radius: 18px;
  padding: 1rem; z-index: 600; width: 250px; box-shadow: 0 24px 64px rgba(0,0,0,.55);
}
.ed-preview { font-family: var(--display); font-size: 1.7rem; font-weight: 600; text-align: center; padding: .4rem; background: rgba(255,255,255,.06); border-radius: 12px; margin-bottom: .7rem; color: var(--acid); min-height: 3rem; line-height: 1.2; }
.ed-label { font-size: .58rem; color: var(--faint); text-transform: uppercase; letter-spacing: .12em; font-weight: 600; margin-bottom: .25rem; }
.ed-input { width: 100%; background: rgba(255,255,255,.06); border: 1.5px solid var(--line); color: var(--ink); padding: .4rem .6rem; border-radius: 10px; font-family: 'DM Mono', monospace; font-size: .88rem; outline: none; margin-bottom: .65rem; transition: .15s; }
.ed-input:focus { border-color: var(--acid); }
.ed-group-lbl { font-size: .52rem; color: var(--faint); text-transform: uppercase; letter-spacing: .12em; font-weight: 600; margin-top: .4rem; margin-bottom: .2rem; }
.ed-grid { display: flex; flex-wrap: wrap; gap: 4px; }
.ed-opt { background: rgba(255,255,255,.06); border: 1px solid transparent; color: var(--ink); padding: .28rem .5rem; border-radius: 8px; font-size: .68rem; cursor: pointer; font-family: 'DM Mono', monospace; transition: .1s; }
.ed-opt:hover { border-color: var(--acid); }
.ed-opt.on { background: var(--acid); color: #120609; font-weight: 700; }
.ed-actions { display: flex; gap: .45rem; margin-top: .8rem; }
.ed-del { background: transparent; border: 1px solid var(--line); color: var(--mute); padding: .4rem .8rem; border-radius: 999px; font-size: .68rem; cursor: pointer; transition: .15s; }
.ed-del:hover { border-color: var(--coral); color: var(--coral); }
.ed-ok { flex: 1; background: var(--acid); border: none; color: #120609; padding: .4rem; border-radius: 999px; font-size: .72rem; cursor: pointer; font-weight: 700; letter-spacing: .03em; transition: .15s; }
.ed-ok:hover { background: #fff; }

/* On phones the editor becomes a bottom sheet so it never runs off-screen */
@media (max-width: 600px) {
  .editor-popup {
    position: fixed; left: .6rem; right: .6rem; bottom: .6rem; top: auto; transform: none;
    width: auto; max-height: 72vh; overflow-y: auto; animation: rise .25s ease;
  }
  .song-nav-title { max-width: 120px; }
  .key-dropdown { left: auto; right: 0; transform: none; }
}

.song-footer { text-align: center; font-size: .62rem; color: var(--faint); letter-spacing: .1em; text-transform: uppercase; margin-top: 2.5rem; padding-bottom: 1rem; }

/* ═══════════ CONFIRM DIALOG ═══════════ */
.confirm-overlay { position: fixed; inset: 0; background: rgba(12,2,4,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 9000; display: flex; align-items: center; justify-content: center; animation: fadeIn .15s ease; }
.confirm-box { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 2rem; max-width: 380px; width: 90%; box-shadow: 0 30px 80px rgba(0,0,0,.6); text-align: center; }
.confirm-box h3 { font-family: var(--display); font-size: 1.5rem; font-weight: 500; letter-spacing: -.03em; color: var(--acid); margin-bottom: .6rem; }
.confirm-box p { font-size: .86rem; color: var(--mute); line-height: 1.6; margin-bottom: 1.5rem; }
.confirm-btns { display: flex; gap: .6rem; justify-content: center; }
.confirm-cancel { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: .55rem 1.3rem; border-radius: 999px; cursor: pointer; font-size: .76rem; font-weight: 600; letter-spacing: .03em; transition: .15s; }
.confirm-cancel:hover { border-color: var(--acid); color: var(--acid); }
.confirm-danger { background: var(--coral); border: none; color: #120609; padding: .55rem 1.3rem; border-radius: 999px; cursor: pointer; font-size: .76rem; font-weight: 700; letter-spacing: .03em; transition: .15s; }
.confirm-danger:hover { background: #fff; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (max-width: 600px) { .ed-input { font-size: 16px; } }
.menu-main { align-items: start; }
.focus-panel { position: sticky; top: 2rem; align-self: start; padding-bottom: 0; }
.song-item { font-size: clamp(1.5rem, 3.6vw, 2.5rem); }
.item-text { display: block; min-width: 0; }
.item-title { display: inline; }
.key-sup { display: inline-block; vertical-align: .55em; margin: 0 0 0 .4rem; }
.item-artist { display: none; margin-top: .15rem; }
.menu-page { padding-bottom: 8rem; }
.menu-actions { left: 0; right: 0; bottom: 0; padding: 2.5rem clamp(1rem,4vw,3rem) 1.1rem;
  background: linear-gradient(to top, rgba(18,6,9,.96) 35%, rgba(18,6,9,0)); }
.sec-body { padding-bottom: .4rem; }
.add-row-wrap { margin-top: 0; }
@media (max-width: 760px) { .item-artist { display: block; } .song-list { gap: .9rem; } .song-item { font-size: clamp(1.5rem, 7vw, 2.2rem); } }

/* ═══════ NEON RED / YELLOW THEME + TIDY LIBRARY ═══════ */
:root { --acid:#fff12e; --red:#ff2d4f; --mint:#ff3d5e; --sky:#ff9a1f; --violet:#ffe0b0; --coral:#ff2d4f; --panel:#210a10; --bg:#120609; }
body {
  background:
    radial-gradient(55% 45% at 85% 8%, rgba(255,38,70,.34), transparent 62%),
    radial-gradient(50% 45% at 8% 95%, rgba(255,38,70,.26), transparent 60%),
    radial-gradient(45% 40% at 95% 90%, rgba(255,241,46,.12), transparent 65%),
    var(--bg);
  background-attachment: fixed;
}
.pill:hover, .save-btn:hover, .ed-ok:hover, .confirm-danger:hover { background:#fff; }
.pill.active { background:#000; color:var(--acid); box-shadow: inset 0 0 0 1.5px var(--red), 0 0 18px rgba(255,45,79,.5); }
.pill.active::before { background:var(--red); box-shadow:0 0 8px var(--red); }
.pill, .save-btn { box-shadow: 0 0 18px rgba(255,241,46,.28); }
.pill.ghost, .back-btn { box-shadow: inset 0 0 0 2px var(--acid), 0 0 14px rgba(255,241,46,.22); }
.save-btn.saved { background:#fff; color:#120609; }
.brand-name { text-shadow: 0 0 28px rgba(255,241,46,.35); }
.song-hero h1 { text-shadow: 0 0 34px rgba(255,241,46,.35); }
.sc-note, .about-card h2, .confirm-box h3 { text-shadow: 0 0 14px rgba(255,241,46,.25); }
.chord-pill.t-min { box-shadow: 0 0 16px rgba(255,61,94,.14); }
.chord-pill.t-maj { box-shadow: 0 0 16px rgba(255,241,46,.10); }
.section { border-color: rgba(255,120,90,.16); }
.song-nav { border-bottom: 1px solid rgba(255,45,79,.35); }
.song-footer { color: rgba(255,244,234,.34); }

/* logo */
.brand { display:flex; align-items:flex-start; gap:clamp(.8rem,2vw,1.4rem); min-width:0; }
.logo-badge { flex-shrink:0; width:clamp(46px,6vw,62px); height:clamp(46px,6vw,62px); border-radius:18px; background:#fff6ea; display:grid; place-items:center; box-shadow:0 0 0 2px rgba(255,241,46,.8), 0 0 26px rgba(255,45,79,.55); margin-top:.35rem; }
.logo-badge img { width:78%; height:78%; object-fit:contain; display:block; }
.nav-logo { width:30px; height:30px; border-radius:9px; background:#fff6ea; padding:3px; object-fit:contain; box-shadow:0 0 12px rgba(255,45,79,.5); flex-shrink:0; }
@media (max-width:480px){ .nav-logo{display:none;} }
.brand-name { font-size: clamp(1.9rem, 5.4vw, 4rem); line-height:.96; }
.brand-tag { margin-top:.7rem; }
.menu-main, .focus-panel, .song-list.__old { display:none; }

/* song library */
.menu-page { max-width: 1040px; padding-bottom: 8rem; }
.song-board { margin-top: clamp(1.8rem,5vh,3.2rem); animation: fadeIn .35s ease; }
.board-head { display:flex; align-items:baseline; justify-content:space-between; gap:1rem; padding:0 .3rem .8rem; }
.board-title { font-family:var(--display); font-weight:500; font-size:1.35rem; letter-spacing:-.02em; color:#fff; }
.board-count { font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--red); font-weight:700; text-shadow:0 0 12px rgba(255,45,79,.7); }
.board-cols, .song-row { display:grid; grid-template-columns: 2.6rem minmax(0,1fr) minmax(0,15rem) 3.4rem 5.6rem 4.4rem; align-items:center; column-gap:1rem; }
.board-cols { padding:.55rem 1.1rem; font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); border-bottom:1px solid rgba(255,45,79,.4); }
.song-list { list-style:none; display:flex; flex-direction:column; gap:.5rem; margin-top:.7rem; }
.song-list li { animation: rise .5s ease both; }
.song-row {
  position:relative; cursor:pointer; padding:.85rem 1.1rem; border-radius:16px;
  background: rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.08); transition: transform .2s, border-color .2s, background .2s, box-shadow .2s;
}
.song-row::before { content:''; position:absolute; left:0; top:20%; bottom:20%; width:3px; border-radius:3px; background:var(--red); box-shadow:0 0 12px var(--red); opacity:.55; transition:.2s; }
.song-row:hover, .song-row:focus-visible { background: rgba(255,45,79,.09); border-color: rgba(255,241,46,.65); transform: translateX(3px); box-shadow: 0 0 26px rgba(255,45,79,.22); }
.song-row:hover::before, .song-row:focus-visible::before { background:var(--acid); box-shadow:0 0 14px var(--acid); opacity:1; }
.row-idx { font-family:'DM Mono',monospace; font-size:.8rem; color:var(--red); font-weight:500; text-shadow:0 0 10px rgba(255,45,79,.6); }
.row-main { display:flex; flex-direction:column; gap:.15rem; min-width:0; }
.row-title { font-family:var(--display); font-weight:500; font-size:clamp(1.05rem,2.2vw,1.45rem); letter-spacing:-.02em; color:#fff; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.song-row:hover .row-title { color:var(--acid); }
.row-artist { font-size:.78rem; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row-prev { display:flex; gap:.3rem; flex-wrap:nowrap; overflow:hidden; }
.mini-chord { font-family:var(--display); font-weight:600; font-size:.78rem; padding:.18rem .55rem; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:var(--ink); white-space:nowrap; }
.key-chip { display:inline-block; font-family:var(--display); font-weight:700; font-size:.92rem; min-width:2.4rem; text-align:center; padding:.22rem .6rem; border-radius:999px; background:var(--acid); color:#120609; box-shadow:0 0 16px rgba(255,241,46,.4); }
.row-sec { font-size:.8rem; color:var(--mute); font-family:'DM Mono',monospace; }
.row-sec em { font-style:normal; font-family:'DM Sans',sans-serif; font-size:.7rem; color:var(--faint); }
.row-end { display:flex; align-items:center; justify-content:flex-end; gap:.3rem; }
.row-go { color:var(--acid); font-size:1.15rem; opacity:.55; transition:.2s; }
.song-row:hover .row-go { opacity:1; transform:translateX(3px); }
.song-del { background:none; border:none; color:rgba(255,255,255,.4); font-size:.8rem; cursor:pointer; padding:.35rem .5rem; border-radius:999px; opacity:0; transition:.2s; }
.song-row:hover .song-del, .song-del:focus-visible { opacity:1; }
.song-del:hover { background:var(--red); color:#fff; }
@media (hover:none){ .song-del{opacity:.6;} }

@media (max-width: 860px) {
  .board-cols, .song-row { grid-template-columns: 2.2rem minmax(0,1fr) 3.2rem 2.4rem; }
  .c-prev, .row-prev, .c-sec, .row-sec { display:none; }
  .row-end .song-del { position:absolute; top:.35rem; right:.4rem; }
  .row-end { grid-column:4; }
}
@media (max-width: 520px) {
  .board-cols { display:none; }
  .song-row { grid-template-columns: 1.9rem minmax(0,1fr) auto 1.2rem; column-gap:.7rem; padding:.8rem .85rem; }
  .row-title { white-space:normal; }
}

/* ═══════ v3: search, tags, setlists, stage mode, read-only, shared saving ═══════ */
.search-row { padding: 0 .1rem .7rem; }
.search-input {
  width: 100%; background: rgba(255,255,255,.05); border: 1.5px solid var(--line); color: var(--ink);
  padding: .7rem 1.1rem; border-radius: 999px; font-size: .92rem; outline: none; transition: .2s;
}
.search-input::placeholder { color: var(--faint); }
.search-input:focus { border-color: var(--acid); box-shadow: 0 0 18px rgba(255,241,46,.2); }
.tag-filters { display: flex; flex-wrap: wrap; gap: .4rem; padding: 0 .1rem 1rem; }
.tag-filter {
  background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 999px;
  padding: .3rem .85rem; font-size: .74rem; font-weight: 500; letter-spacing: .03em; cursor: pointer; transition: .15s;
  display: inline-flex; align-items: center; gap: .4rem;
}
.tag-filter:hover { border-color: var(--red); color: #fff; }
.tag-filter.on { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 0 16px rgba(255,45,79,.5); font-weight: 700; }
.tf-n { font-size: .62rem; opacity: .65; font-family: 'DM Mono', monospace; }
.empty-note { padding: 2rem 1rem; text-align: center; color: var(--mute); font-size: .9rem; }
.link-btn { background: none; border: none; color: var(--acid); cursor: pointer; text-decoration: underline; font-size: inherit; }

/* hero tags */
.hero-tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
.tag-chip { display: inline-flex; align-items: center; gap: .3rem; font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: .22rem .75rem; border-radius: 999px; color: var(--red); border: 1px solid rgba(255,45,79,.6); background: rgba(255,45,79,.1); }
.tag-x { background: none; border: none; color: inherit; cursor: pointer; font-size: .65rem; opacity: .7; padding: 0 .1rem; }
.tag-x:hover { opacity: 1; color: #fff; }
.tag-add { background: transparent; border: 1px dashed var(--line); color: var(--mute); border-radius: 999px; padding: .22rem .75rem; font-size: .68rem; cursor: pointer; transition: .15s; }
.tag-add:hover { border-color: var(--acid); color: var(--acid); }

/* buttons added */
.stage-btn { background: var(--red); color: #fff; border: none; padding: .5rem 1rem; border-radius: 999px; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; white-space: nowrap; box-shadow: 0 0 18px rgba(255,45,79,.55); transition: .2s; }
.stage-btn:hover { background: #fff; color: #120609; }
.save-btn.dirty { animation: pulseSave 1.6s ease-in-out infinite; }
@keyframes pulseSave { 0%,100% { box-shadow: 0 0 18px rgba(255,241,46,.3); } 50% { box-shadow: 0 0 0 3px rgba(255,45,79,.8), 0 0 26px rgba(255,45,79,.7); } }
.confirm-ok { background: var(--acid); border: none; color: #120609; padding: .55rem 1.3rem; border-radius: 999px; cursor: pointer; font-size: .76rem; font-weight: 700; letter-spacing: .03em; transition: .15s; }
.confirm-ok:hover { background: #fff; }
.confirm-ok:disabled { opacity: .5; cursor: default; }
.confirm-btns.wrap { flex-wrap: wrap; }
.pass-input { text-align: center; font-size: 1rem; margin-bottom: .5rem; }
.pass-err { color: var(--red); font-size: .8rem; margin-bottom: .8rem; }
.reset-btn.editing { border-color: var(--acid); color: var(--acid); }

/* menu actions with left/right groups */
.menu-actions { gap: .6rem; }
.ma-left, .ma-right { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; pointer-events: auto; }
.ma-left:empty, .ma-right:empty { display: none; }

/* status, toast, dirty bar */
.status-banner { position: sticky; top: 0; z-index: 300; background: #ff2d4f; color: #fff; text-align: center; font-size: .78rem; font-weight: 600; padding: .45rem 1rem; }
.toast {
  position: fixed; left: 50%; bottom: 5.2rem; transform: translateX(-50%); z-index: 9500; max-width: 90vw;
  background: #fff; color: #120609; font-weight: 600; font-size: .82rem; padding: .6rem 1.2rem; border-radius: 999px;
  box-shadow: 0 10px 40px rgba(0,0,0,.5), 0 0 24px rgba(255,241,46,.35); animation: rise .25s ease;
}
.dirty-bar {
  position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); z-index: 400; display: flex; align-items: center; gap: .7rem;
  background: rgba(33,10,16,.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1.5px solid var(--red); border-radius: 999px; padding: .5rem .6rem .5rem 1.1rem; box-shadow: 0 0 30px rgba(255,45,79,.45);
  max-width: 94vw; animation: rise .25s ease;
}
.dirty-bar.above { bottom: 4.6rem; }
.dirty-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); flex-shrink: 0; }
.dirty-text { font-size: .78rem; font-weight: 600; white-space: nowrap; }
.dirty-btn { background: var(--acid); color: #120609; border: none; font-weight: 700; font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; padding: .45rem 1rem; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.dirty-btn:hover { background: #fff; }
.dirty-btn:disabled { opacity: .6; }
.dirty-discard { background: transparent; border: none; color: var(--mute); font-size: .72rem; cursor: pointer; padding: .4rem .6rem; border-radius: 999px; }
.dirty-discard:hover { color: var(--coral); }

.loading-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
.logo-badge.pulse { margin: 0; animation: logoPulse 1.4s ease-in-out infinite; }
@keyframes logoPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.loading-text { color: var(--mute); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }

/* setlists list rows */
.song-row.set-row { grid-template-columns: 4.6rem minmax(0,1fr) 5.4rem 2rem; }
.set-date { display: flex; flex-direction: column; align-items: center; line-height: 1; color: var(--acid); }
.set-date b { font-family: var(--display); font-size: 1.7rem; font-weight: 600; text-shadow: 0 0 14px rgba(255,241,46,.35); }
.set-date i { font-style: normal; font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin-top: .25rem; }
.set-date.none { color: var(--faint); }
.set-row .row-artist { white-space: nowrap; }

/* setlist detail */
.setlist-page { min-height: 100vh; }
.set-name-input { width: 100%; background: transparent; border: none; border-bottom: 2px solid rgba(255,45,79,.5); color: var(--acid); font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem,6vw,3.4rem); letter-spacing: -.04em; line-height: 1.05; padding: .2rem 0; outline: none; text-shadow: 0 0 30px rgba(255,241,46,.3); }
.set-name-input:focus { border-bottom-color: var(--acid); }
.set-date-input { margin-top: .9rem; background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: .4rem .9rem; font-size: .82rem; color-scheme: dark; }
.set-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin: .4rem 0 1.4rem; }
.set-actions .pill { text-decoration: none; }
.pill:disabled { opacity: .4; cursor: default; }
.set-items { list-style: none; display: flex; flex-direction: column; gap: .5rem; }
.set-item {
  display: grid; grid-template-columns: 2.4rem minmax(0,1fr) auto auto auto; align-items: center; column-gap: .9rem; row-gap: .4rem;
  background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: .75rem 1rem; position: relative; transition: .2s;
}
.set-item:hover { border-color: rgba(255,241,46,.55); }
.set-item-main { display: flex; flex-direction: column; gap: .12rem; min-width: 0; cursor: pointer; }
.set-note { font-size: .72rem; color: var(--red); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.note-input { width: 11rem; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: .35rem .8rem; font-size: .75rem; outline: none; }
.note-input:focus { border-color: var(--acid); }
.set-key { display: flex; align-items: center; gap: .2rem; }
.set-key .key-step { width: 1.7rem; height: 1.7rem; background: rgba(255,255,255,.07); }
.set-ctl { display: flex; gap: .2rem; }
.set-ctl button { background: rgba(255,255,255,.06); border: none; color: var(--ink); width: 1.9rem; height: 1.9rem; border-radius: 50%; cursor: pointer; font-size: .7rem; transition: .15s; }
.set-ctl button:hover:not(:disabled) { background: var(--acid); color: #120609; }
.set-ctl button.danger:hover { background: var(--red); color: #fff; }
.set-ctl button:disabled { opacity: .25; cursor: default; }
.set-add { margin-top: 1.1rem; }
@media (max-width: 720px) {
  .set-item { grid-template-columns: 2rem minmax(0,1fr) auto; }
  .note-input { grid-column: 2 / 4; width: 100%; }
  .set-key { grid-column: 2; }
  .set-ctl { grid-column: 3; }
  .song-row.set-row { grid-template-columns: 3.6rem minmax(0,1fr) 2rem; }
  .song-row.set-row .row-sec { display: none; }
}

/* pick songs dialog */
.pick-box { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 1.3rem; width: min(520px,92vw); max-height: 82vh; display: flex; flex-direction: column; gap: .8rem; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.pick-head { display: flex; align-items: center; justify-content: space-between; }
.pick-head h3 { font-family: var(--display); font-weight: 500; font-size: 1.4rem; color: var(--acid); letter-spacing: -.03em; }
.pick-list { overflow-y: auto; display: flex; flex-direction: column; gap: .35rem; padding-right: .2rem; }
.pick-row { display: flex; align-items: center; gap: .7rem; text-align: left; background: rgba(255,255,255,.04); border: 1px solid transparent; color: var(--ink); border-radius: 12px; padding: .65rem .9rem; cursor: pointer; transition: .15s; }
.pick-row:hover { border-color: var(--acid); background: rgba(255,241,46,.07); }
.pick-title { font-family: var(--display); font-weight: 500; font-size: 1rem; flex: 1; min-width: 0; }
.pick-artist { font-size: .74rem; color: var(--mute); }
.pick-badge { font-size: .68rem; color: #120609; background: var(--acid); border-radius: 999px; padding: .08rem .5rem; font-weight: 700; }
.pick-plus { color: var(--acid); font-size: 1.1rem; font-weight: 600; }

/* setlist bar inside a song */
.set-bar { display: flex; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; margin-top: 1rem; padding: .6rem .6rem .6rem 1.1rem; border-radius: 999px; background: rgba(255,45,79,.12); border: 1px solid rgba(255,45,79,.55); }
.set-bar-info { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; min-width: 0; }
.set-bar-name { font-family: var(--display); font-weight: 600; font-size: .95rem; }
.set-bar-pos { font-family: 'DM Mono', monospace; font-size: .75rem; color: var(--acid); }
.set-bar-note { font-size: .7rem; color: var(--red); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.set-bar-btns { display: flex; gap: .35rem; }
.set-bar-btns button { background: var(--acid); border: none; color: #120609; font-weight: 700; font-size: .72rem; padding: .4rem .9rem; border-radius: 999px; cursor: pointer; }
.set-bar-btns button:disabled { opacity: .3; cursor: default; }

/* read-only (viewers) */
.song-page.ro .add-ch-btn, .song-page.ro .del-row-btn, .song-page.ro .add-row-wrap, .song-page.ro .del-sec { display: none; }
.song-page.ro .chord-pill { cursor: default; }
.song-page.ro .chord-pill:hover { transform: none; filter: none; }
.song-page.ro .rep-tag { cursor: default; }
.song-page.ro .rep-tag:hover { background: transparent; color: var(--acid); }
.sec-name-ro { display: inline-block; border: 1px solid transparent; padding: .15rem .35rem; }

/* ═══════ STAGE MODE ═══════ */
.song-page.stage { --sz: 1.25; }
.song-page.stage .song-nav, .song-page.stage .scale-bar, .song-page.stage .legend, .song-page.stage .toolbar,
.song-page.stage .song-footer, .song-page.stage .add-ch-btn, .song-page.stage .del-row-btn, .song-page.stage .add-row-wrap,
.song-page.stage .del-sec, .song-page.stage .rep-tag.empty, .song-page.stage .row-num, .song-page.stage .hero-tags,
.song-page.stage .set-bar, .song-page.stage .ch-sub { display: none; }
.song-page.stage .song-content { max-width: 1280px; padding-bottom: 11rem; }
.song-page.stage .song-hero { padding: 1.2rem 0 1rem; }
.song-page.stage .song-hero h1 { font-size: clamp(1.8rem, 5vw, 3.2rem); }
.song-page.stage .ch-name { font-size: calc(1.3rem * var(--sz)); }
.song-page.stage .chord-pill { padding: calc(.55rem * var(--sz)) calc(.95rem * var(--sz)); min-width: calc(3.3rem * var(--sz)); min-height: calc(3rem * var(--sz)); border-radius: calc(14px * var(--sz)); cursor: default; }
.song-page.stage .chord-pill:hover { transform: none; filter: none; }
.song-page.stage .chord-row { gap: calc(.35rem * var(--sz)); }
.song-page.stage .sep { font-size: calc(.85rem * var(--sz)); }
.song-page.stage .sec-name { font-size: calc(.86rem * var(--sz)); letter-spacing: .14em; }
.song-page.stage .rep-tag { font-size: calc(.62rem * var(--sz)); }
.song-page.stage .sec-body { gap: calc(.7rem * var(--sz)); }
.song-page.stage .chord-annotation, .song-page.stage .chord-pill span[style] { font-size: calc(.5rem * var(--sz)) !important; max-width: none !important; }

.stage-dock {
  position: fixed; left: 50%; bottom: .8rem; transform: translateX(-50%); z-index: 700; width: min(720px, 96vw);
  display: flex; flex-direction: column; gap: .5rem; padding: .7rem; border-radius: 26px;
  background: rgba(18,6,9,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1.5px solid rgba(255,45,79,.7); box-shadow: 0 0 36px rgba(255,45,79,.4), 0 20px 50px rgba(0,0,0,.6);
}
.dock-row { display: flex; gap: .5rem; align-items: center; justify-content: center; flex-wrap: wrap; }
.dock-btn { background: rgba(255,255,255,.08); border: 1px solid var(--line); color: var(--ink); font-weight: 600; font-size: .8rem; padding: .6rem 1.1rem; border-radius: 999px; cursor: pointer; transition: .15s; white-space: nowrap; }
.dock-btn:hover:not(:disabled) { border-color: var(--acid); color: var(--acid); }
.dock-btn:disabled { opacity: .3; cursor: default; }
.dock-btn.exit { color: var(--coral); }
.dock-btn.play:hover:not(:disabled) { background: #fff; color: #120609; border-color: #fff; }
.dock-btn.play.on:hover:not(:disabled) { background: #fff; color: #ff2d4f; }
.dock-btn.play { background: var(--acid); color: #120609; border-color: var(--acid); font-weight: 700; min-width: 8.5rem; box-shadow: 0 0 18px rgba(255,241,46,.4); }
.dock-btn.play.on { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 0 18px rgba(255,45,79,.6); }
.dock-group { display: flex; align-items: center; gap: .3rem; background: rgba(255,255,255,.06); border-radius: 999px; padding: .2rem .3rem .2rem .8rem; }
.dock-lbl { font-size: .58rem; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; margin-right: .15rem; }
.dock-mini { width: 2rem; height: 2rem; border-radius: 50%; border: none; background: transparent; color: var(--ink); font-size: 1rem; font-weight: 700; cursor: pointer; transition: .15s; }
.dock-mini:hover { background: var(--acid); color: #120609; }
.dock-val { min-width: 1.6rem; text-align: center; font-family: var(--display); font-weight: 600; font-size: .95rem; color: var(--acid); }
.dock-val.key { min-width: 2.4rem; }
@media (prefers-reduced-motion: reduce) { .save-btn.dirty { animation: none; } }
@media (max-width: 480px) {
  .dock-btn { padding: .55rem .8rem; font-size: .74rem; }
  .dock-btn.play { min-width: 6.4rem; }
  .dock-row { gap: .4rem; }
  .dock-group { padding-left: .6rem; }
  .dock-mini { width: 1.8rem; height: 1.8rem; }
}
</style>

const DIATONIC = {
  C:['C','D','E','F','G','A','B'], Db:['Db','Eb','F','Gb','Ab','Bb','C'],
  D:['D','E','F#','G','A','B','C#'], Eb:['Eb','F','G','Ab','Bb','C','D'],
  E:['E','F#','G#','A','B','C#','D#'], F:['F','G','A','Bb','C','D','E'],
  'F#':['F#','G#','A#','B','C#','D#','E#'], Gb:['Gb','Ab','Bb','Cb','Db','Eb','F'],
  G:['G','A','B','C','D','E','F#'], Ab:['Ab','Bb','C','Db','Eb','F','G'],
  A:['A','B','C#','D','E','F#','G#'], Bb:['Bb','C','D','Eb','F','G','A'],
  B:['B','C#','D#','E','F#','G#','A#'],
};
const KEY_LIST = [
  {id:'C',l:'C'},{id:'Db',l:'D♭'},{id:'D',l:'D'},{id:'Eb',l:'E♭'},
  {id:'E',l:'E'},{id:'F',l:'F'},{id:'F#',l:'F♯'},{id:'Gb',l:'G♭'},
  {id:'G',l:'G'},{id:'Ab',l:'A♭'},{id:'A',l:'A'},{id:'Bb',l:'B♭'},{id:'B',l:'B'},
];
const KEY_CYCLE = KEY_LIST.map(k=>k.id);
const fmt = n => n ? n.replace(/##/g,'𝄪').replace(/#/g,'♯').replace(/b/g,'♭') : '';
const DEG_LABELS = ['I','II','III','IV','V','VI','VII'];
const DEG_Q = ['maj','min','min','maj','maj','min','dim'];

function resolveChord(token, key) {
  const sc = DIATONIC[key]||DIATONIC.C;
  if (!token||token==='Tutti') return {display:'TUTTI',sub:'',type:'tutti'};
  if (token==='7') return {display:`${fmt(sc[4])}/${fmt(sc[6])}`,sub:'V/vii',type:'slash'};

  const slCh = token.match(/^(\d+)\/(\d+)#$/);
  if (slCh) {
    const cr = fmt(sc[+slCh[1]-1]);
    const bn = fmt(sc[+slCh[2]-1]+'#');
    return {display:`${cr}/${bn}`,sub:token,type:'slash'};
  }
  const sl = token.match(/^(\d+)\/(\d+)$/);
  if (sl) {
    const cr = fmt(sc[+sl[1]-1]);
    const bn = fmt(sc[+sl[2]-1]);
    return {display:`${cr}m/${bn}`,sub:token,type:'slash'};
  }
  const dim = token.match(/^(\d+)dim$/);
  if (dim) return {display:`${fmt(sc[+dim[1]-1])}°`,sub:token,type:'dim'};
  const ch = token.match(/^(\d+)#(m?)$/);
  if (ch) return {display:`${fmt(sc[+ch[1]-1]+'#')}${ch[2]?'m':''}`,sub:token,type:'chrom'};
  const nm = token.match(/^(\d+)(m?)$/);
  if (nm) {
    const root = fmt(sc[+nm[1]-1]);
    const isMin = nm[2]==='m';
    return {display:`${root}${isMin?'m':''}`,sub:token,type:isMin?'min':'maj'};
  }
  return {display:fmt(token),sub:token,type:'normal'};
}

const STORE_KEY  = 'chordbook_v2';              // local-mode document {songs,setlists,seen,keys}
const KEYS_KEY   = 'chordbook_keys_v1';         // each person's own key choices
const CACHE_KEY  = 'chordbook_shared_cache_v1'; // last copy downloaded from the shared server
const EDITOR_KEY = 'chordbook_editor_v1';       // editor passcode remembered on this device

// starter tags for the built-in songs (editors can change them)
const DEFAULT_TAGS = {
  sepertimatilampu:['Pop'], song2:['Pop'], song3:['Pop'], song4:['Medley'],
  song5:['Jawa'], song6:['Jawa'], song7:['Kosmus'], song8:['Pop'], song9:['Pop']
};
SONGS_DEFAULT.forEach(s=>{ s.tags = (DEFAULT_TAGS[s.id]||[]).slice(); });

const lsGet = k => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):null; } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); return true; } catch(e){ return false; } };
const clone = o => JSON.parse(JSON.stringify(o));
const snap  = (songs,setlists) => JSON.stringify({songs,setlists});
const pad2  = n => String(n).padStart(2,'0');

// Turn a saved document into live state. Built-in songs added in a newer
// version of the site appear automatically; songs an editor deleted stay deleted.
function buildState(doc) {
  const ids = SONGS_DEFAULT.map(s=>s.id);
  if (!doc || !Array.isArray(doc.songs)) return {songs:clone(SONGS_DEFAULT), setlists:[], seen:ids};
  const have = new Set(doc.songs.map(s=>s.id));
  const seen = new Set(doc.seen||[]);
  const songs = doc.songs.map(s=> (s.tags===undefined && DEFAULT_TAGS[s.id]) ? {...s, tags:DEFAULT_TAGS[s.id].slice()} : s);
  const extra = clone(SONGS_DEFAULT).filter(s=>!have.has(s.id) && !seen.has(s.id));
  return {
    songs:[...songs, ...extra],
    setlists: Array.isArray(doc.setlists) ? doc.setlists : [],
    seen:[...new Set([...(doc.seen||[]), ...ids])]
  };
}

async function apiPost(body) {
  try {
    const r = await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    let j={}; try{ j=await r.json(); }catch(e){}
    return {ok:r.ok,status:r.status,json:j};
  } catch(e) { return {ok:false,status:0,json:{}}; }
}

function initialApp() {
  if (location.protocol==='file:') {
    const st = buildState(lsGet(STORE_KEY));
    return {mode:'local',...st,version:0,snapshot:snap(st.songs,st.setlists)};
  }
  const cache = lsGet(CACHE_KEY);
  if (cache && cache.data) {
    const st = buildState(cache.data);
    return {mode:'shared',...st,version:cache.version||0,snapshot:snap(st.songs,st.setlists)};
  }
  return {mode:'loading',songs:[],setlists:[],seen:[],version:0,snapshot:null};
}

function parseHash() {
  let hash = window.location.hash.replace(/^#\/?/,'');
  let query = '';
  const qi = hash.indexOf('?');
  if (qi>=0) { query = hash.slice(qi+1); hash = hash.slice(0,qi); }
  const params = new URLSearchParams(query);
  if (!hash) return {page:'menu',tab:'songs'};
  if (hash==='about') return {page:'menu',tab:'about'};
  if (hash==='setlists') return {page:'menu',tab:'setlists'};
  let m = hash.match(/^setlist\/([^\/]+)$/);
  if (m) return {page:'setlist',setId:decodeURIComponent(m[1])};
  m = hash.match(/^song\/([^\/]+)(?:\/in\/([^\/]+)\/(\d+))?$/);
  if (m) return {page:'song',songId:decodeURIComponent(m[1]),setId:m[2]?decodeURIComponent(m[2]):null,index:m[3]!==undefined?+m[3]:null,stage:params.get('stage')==='1'};
  return {page:'menu',tab:'songs'};
}
function setHash(hash) { window.location.hash = hash ? '#/'+hash : '#/'; }

function fmtDate(d) {
  if (!d) return '';
  try { return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); } catch(e){ return d; }
}
function todayStr() { const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

  const [note, setNote] = useState(annotation||'');
  const inpRef = useRef();
  const {display} = resolveChord(val.trim()||token, currKey);
  useEffect(()=>{setTimeout(()=>{inpRef.current?.focus();inpRef.current?.select();},40);},[]);
  return h('div',{className:'editor-popup'},
    h('div',{className:'ed-preview'},display),
    h('div',{className:'ed-label'},'Numeral Code'),
    h('input',{ref:inpRef,className:'ed-input',value:val,placeholder:'e.g. 6m  2#m  6/7  2dim',
      onChange:e=>setVal(e.target.value),
      onKeyDown:e=>{if(e.key==='Enter')onApply(val.trim(),note.trim());if(e.key==='Escape')onClose();}}),
    h('div',{className:'ed-label'},'Annotation (optional)'),
    h('input',{className:'ed-input',value:note,placeholder:'e.g. staccato, repeat…',
      style:{marginBottom:'.5rem'},
      onChange:e=>setNote(e.target.value),
      onKeyDown:e=>{if(e.key==='Enter')onApply(val.trim(),note.trim());if(e.key==='Escape')onClose();}}),
    ...QUICK_GROUPS.map(g=>h('div',{key:g.label},
      h('div',{className:'ed-group-lbl'},g.label),
      h('div',{className:'ed-grid'},
        ...g.tokens.map(t=>h('button',{key:t,className:`ed-opt${val===t?' on':''}`,onClick:()=>setVal(t)},t))
      )
    )),
    h('div',{className:'ed-actions'},
      h('button',{className:'ed-del',onClick:onDelete},'Delete'),
      h('button',{className:'ed-ok',onClick:()=>onApply(val.trim(),note.trim())},'Apply ↵')
    )
  );
}

// SONG VIEW PAGE

const STAGE_SIZES = [1,1.25,1.5,1.8,2.2];

function SongPage({songId, songs, setSongs, keysMap, setKeysMap, onBack, onResetSong, canEdit, dirty, onSave, ctx, startStage}) {
  const songIdx = songs.findIndex(s=>s.id===songId);
  const song = songs[songIdx];
  const inSet = !!(ctx && ctx.item);
  const [tmpKey, setTmpKey] = useState(null);
  const [stage, setStage] = useState(!!startStage);
  const [scrolling, setScrolling] = useState(false);
  const [speed, setSpeed] = useState(4);
  const [sizeIdx, setSizeIdx] = useState(1);
  const [mode, setMode] = useState('chords');
  const [activeEd, setActiveEd] = useState(null);
  const [showKeyDd, setShowKeyDd] = useState(false);
  const [saved, setSaved] = useState(false);
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const ro = !canEdit || stage;

  const ctxKey = inSet ? ctx.setlist.id+':'+ctx.index : '';
  const baseKey = keysMap[songId] || song.defaultKey;
  const currKey = inSet ? (tmpKey || ctx.item.key || song.defaultKey) : baseKey;
  const scale = DIATONIC[currKey]||DIATONIC.C;
  const setCurrKey = k => {
    if (inSet) { if (canEdit) ctx.onItemKey(k); else setTmpKey(k); }
    else setKeysMap(prev=>({...prev,[songId]:k}));
  };
  const stepKey = dir => {
    const i = KEY_CYCLE.indexOf(currKey);
    setCurrKey(KEY_CYCLE[(i+dir+KEY_CYCLE.length)%KEY_CYCLE.length]);
  };

  // reset view state when the song (or setlist position) changes
  useEffect(()=>{ setTmpKey(null); setActiveEd(null); setScrolling(false); window.scrollTo(0,0); },[songId,ctxKey]);

  useEffect(()=>{
    const handler=e=>{
      if(!e.target.closest('.chord-pill-wrap')&&!e.target.closest('.editor-popup'))setActiveEd(null);
      if(!e.target.closest('.key-picker-rel'))setShowKeyDd(false);
    };
    document.addEventListener('mousedown',handler);
    return ()=>document.removeEventListener('mousedown',handler);
  },[]);

  // stage mode: keep the screen awake
  useEffect(()=>{
    if (!stage) return;
    let lock=null;
    const req=async()=>{ try{ if('wakeLock' in navigator) lock=await navigator.wakeLock.request('screen'); }catch(e){} };
    req();
    const vis=()=>{ if(document.visibilityState==='visible') req(); };
    document.addEventListener('visibilitychange',vis);
    return ()=>{ document.removeEventListener('visibilitychange',vis); try{ lock&&lock.release(); }catch(e){} };
  },[stage]);

  // stage mode: auto-scroll
  useEffect(()=>{
    if (!stage||!scrolling) return;
    let raf, last=performance.now(), acc=0;
    const tick=now=>{
      const dt=(now-last)/1000; last=now;
      acc+=speed*9*dt;
      if (acc>=1) { const px=Math.floor(acc); window.scrollBy(0,px); acc-=px; }
      if (window.innerHeight+window.scrollY >= document.documentElement.scrollHeight-2) { setScrolling(false); return; }
      raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    const pause=e=>{ if(e.target&&e.target.closest&&e.target.closest('.stage-dock')) return; setScrolling(false); };
    window.addEventListener('wheel',pause,{passive:true});
    window.addEventListener('touchstart',pause,{passive:true});
    return ()=>{ cancelAnimationFrame(raf); window.removeEventListener('wheel',pause); window.removeEventListener('touchstart',pause); };
  },[stage,scrolling,speed]);

  // stage mode: keyboard (Esc = exit, Space = start/stop scrolling)
  useEffect(()=>{
    if (!stage) return;
    const onKey=e=>{
      if (e.key==='Escape') { setStage(false); setScrolling(false); }
      else if (e.key===' ' && !/INPUT|TEXTAREA/.test(e.target.tagName)) { e.preventDefault(); setScrolling(v=>!v); }
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[stage]);

  const upd = fn => setSongs(prev=>{
    const n=JSON.parse(JSON.stringify(prev));
    fn(n[songIdx]);
    return n;
  });

  const isActive=(si,ri,ci)=>activeEd&&activeEd.si===si&&activeEd.ri===ri&&activeEd.ci===ci;

  const applyChord=(si,ri,ci,v,note)=>{ upd(s=>{s.sections[si].rows[ri][ci]=note?{t:v,note}:v;}); setActiveEd(null); };
  const delChord=(si,ri,ci)=>{ upd(s=>{s.sections[si].rows[ri].splice(ci,1);if(!s.sections[si].rows[ri].length)s.sections[si].rows.splice(ri,1);}); setActiveEd(null); };
  const addChord=(si,ri)=>upd(s=>s.sections[si].rows[ri].push('1'));
  const addRow=si=>upd(s=>s.sections[si].rows.push(['1']));
  const delRow=(si,ri)=>upd(s=>{s.sections[si].rows.splice(ri,1);if(!s.sections[si].rows.length)s.sections[si].rows.push(['1']);});
  const addSection=()=>{const n=prompt('Section name:','New Section');if(n)upd(s=>s.sections.push({id:_nextId++,name:n.trim(),repeat:null,rows:[['1','4','5']]}));};
  const delSection=si=>{if(confirm(`Remove "${song.sections[si].name}"?`))upd(s=>s.sections.splice(si,1));};
  const editRepeat=si=>{ if(!canEdit) return; const v=prompt('Repeat label (empty to remove):',song.sections[si].repeat||'');if(v!==null)upd(s=>s.sections[si].repeat=v.trim()||null);};
  const addTag=()=>{ const t=(prompt('New tag (e.g. Misa, Natal, Pop):','')||'').trim().slice(0,24); if(t) upd(s=>{ s.tags=s.tags||[]; if(!s.tags.some(x=>x.toLowerCase()===t.toLowerCase())) s.tags.push(t); }); };
  const delTag=t=>upd(s=>{ s.tags=(s.tags||[]).filter(x=>x!==t); });

  const doSave=async()=>{
    const k=keysMap[songId];
    // saving from a song page also makes the key you are viewing the song's default
    const xf=(!inSet && k && k!==song.defaultKey) ? (list=>list.map(s=>s.id===songId?{...s,defaultKey:k}:s)) : null;
    const ok=await onSave(xf);
    if (ok) {
      if (xf) setKeysMap(prev=>{const n={...prev};delete n[songId];return n;});
      setSaved(true); setTimeout(()=>setSaved(false),2200);
    }
  };

  const handleResetSong=()=>{ setShowResetConfirm(false); onResetSong(songId); };
  const getTA=entry=>typeof entry==='object'&&entry!==null&&entry.t?{token:entry.t,annotation:entry.note||''}:{token:entry,annotation:''};

  const lastIdx = inSet ? ctx.setlist.items.length-1 : 0;
  const speedBtn=(label,val,dec,inc)=>h('div',{className:'dock-group'},
    h('span',{className:'dock-lbl'},label),
    h('button',{className:'dock-mini',onClick:dec,'aria-label':label+' down'},'−'),
    h('span',{className:'dock-val'},val),
    h('button',{className:'dock-mini',onClick:inc,'aria-label':label+' up'},'+')
  );

  return h('div',{className:'song-page'+(stage?' stage':'')+(!canEdit?' ro':''),style:{'--sz':STAGE_SIZES[sizeIdx]}},
    showResetConfirm && h(ConfirmDialog,{
      title:'Reset this song?',
      message:`This will restore "${song.title}" to its original chord data and key. Any edits you made will be lost.`,
      onConfirm:handleResetSong,
      onCancel:()=>setShowResetConfirm(false),
      danger:'Reset Song'
    }),

    // NAV BAR
    h('div',{className:'song-nav'},
      h('button',{className:'back-btn',onClick:onBack},inSet?'← Setlist':'← Songs'),
      h('img',{className:'nav-logo',src:LOGO,alt:'Kosmus Karangpanas'}),
      h('div',{className:'song-nav-title'},song.title),
      h('div',{className:'song-nav-right'},
        h('div',{className:'key-wrap'},
          h('span',{className:'key-lbl'},'Key'),
          h('button',{className:'key-step',onClick:()=>stepKey(-1)},'♭'),
          h('div',{className:'key-picker-rel',style:{position:'relative'}},
            h('button',{className:'key-badge-btn',onClick:()=>setShowKeyDd(v=>!v)},fmt(currKey)),
            showKeyDd&&h('div',{className:'key-dropdown'},
              ...KEY_LIST.map(k=>h('div',{key:k.id,className:`key-opt${k.id===currKey?' active':''}`,onClick:()=>{setCurrKey(k.id);setShowKeyDd(false);}},k.l))
            )
          ),
          h('button',{className:'key-step',onClick:()=>stepKey(1)},'♯'),
        ),
        h('button',{className:'stage-btn',onClick:()=>setStage(true)},'▶ Stage'),
        canEdit && h('button',{className:'song-reset-btn',onClick:()=>setShowResetConfirm(true)},'↺ Reset'),
        canEdit && h('button',{className:`save-btn${saved?' saved':''}${dirty&&!saved?' dirty':''}`,onClick:doSave},saved?'✓ Saved!':'⬇ Save'),
      )
    ),

    // CONTENT
    h('div',{className:'song-content'},
      inSet && h('div',{className:'set-bar'},
        h('div',{className:'set-bar-info'},
          h('span',{className:'set-bar-name'},ctx.setlist.name||'Setlist'),
          h('span',{className:'set-bar-pos'},`${ctx.index+1} / ${ctx.setlist.items.length}`),
          ctx.item.note && h('span',{className:'set-bar-note'},ctx.item.note)
        ),
        h('div',{className:'set-bar-btns'},
          h('button',{disabled:ctx.index===0,onClick:()=>ctx.goto(ctx.index-1,false)},'‹ Prev'),
          h('button',{disabled:ctx.index>=lastIdx,onClick:()=>ctx.goto(ctx.index+1,false)},'Next ›')
        )
      ),
      h('div',{className:'song-hero'},
        h('h1',{},song.title),
        h('p',{},[song.artist, 'Key of '+fmt(currKey), song.sections.length+' sections'].filter(Boolean).join(' · ')),
        ((song.tags&&song.tags.length)||canEdit) && h('div',{className:'hero-tags'},
          ...(song.tags||[]).map(t=>h('span',{key:t,className:'tag-chip'},t,
            canEdit&&h('button',{className:'tag-x','aria-label':'Remove tag '+t,onClick:()=>delTag(t)},'✕'))),
          canEdit&&h('button',{className:'tag-add',onClick:addTag},'+ tag')
        )
      ),
      h('div',{className:'scale-bar'},
        ...scale.map((n,i)=>h('div',{key:i,className:'scale-card'},
          h('div',{className:'sc-note'},fmt(n)),
          h('div',{className:'sc-deg'},DEG_LABELS[i]),
          h('div',{className:'sc-q'},DEG_Q[i])
        ))
      ),
      h('div',{className:'legend'},
        ...[['#fff12e','Major'],['#ff3d5e','Minor'],['#ff9a1f','Slash/Bass'],['#ff5c8a','Chromatic'],['#ffe0b0','Diminished'],['#fff12e','TUTTI']].map(([c,l])=>
          h('div',{key:l},h('span',{className:'leg-dot',style:{background:c}}),l)
        ),
        canEdit && h('div',{style:{marginLeft:'auto',color:'rgba(255,244,234,.34)',fontSize:'.64rem'}},'tap a chord to edit')
      ),
      h('div',{className:'toolbar'},
        canEdit && h('button',{className:'tb-btn',onClick:addSection},'+ Section'),
        canEdit && h('div',{className:'tb-sep'}),
        ...['chords','numerals','both'].map(m=>h('button',{key:m,className:`tb-btn${mode===m?' on':''}`,onClick:()=>setMode(m)},m.charAt(0).toUpperCase()+m.slice(1)))
      ),

      ...song.sections.map((sec,si)=>
        h('div',{key:sec.id||si,className:'section'},
          h('div',{className:'sec-hdr'},
            ro ? h('span',{className:'sec-name sec-name-ro'},sec.name)
               : h('input',{className:'sec-name',value:sec.name,spellCheck:false,
                   style:{width:Math.max(sec.name.length*9+20,80)},
                   onChange:e=>upd(s=>s.sections[si].name=e.target.value)}),
            (canEdit||sec.repeat) && h('div',{className:`rep-tag${sec.repeat?'':' empty'}`,onClick:()=>ro?null:editRepeat(si)},sec.repeat||'+ repeat'),
            canEdit && h('button',{className:'del-sec',onClick:()=>delSection(si)},'✕')
          ),
          h('div',{className:'sec-body'},
            ...sec.rows.map((row,ri)=>
              h('div',{key:ri,className:'chord-row'},
                h('span',{className:'row-num'},ri+1),
                ...row.map((entry,ci)=>{
                  const {token,annotation}=getTA(entry);
                  return [
                    ci>0&&h('span',{key:'s'+ci,className:'sep'},'–'),
                    h('div',{key:'c'+ci,className:'chord-pill-wrap',style:{position:'relative'}},
                      h(ChordPill,{token,annotation,currKey,mode,selected:!ro&&isActive(si,ri,ci),
                        onClick:()=>{ if(ro) return; setActiveEd(isActive(si,ri,ci)?null:{si,ri,ci}); }}),
                      !ro&&isActive(si,ri,ci)&&h(ChordEditor,{token,annotation,currKey,
                        onApply:(v,note)=>applyChord(si,ri,ci,v,note),
                        onDelete:()=>delChord(si,ri,ci),
                        onClose:()=>setActiveEd(null)})
                    )
                  ].filter(Boolean);
                }).flat(),
                canEdit && h('button',{className:'add-ch-btn',title:'Add chord',onClick:()=>addChord(si,ri)},'+'),
                canEdit && h('button',{className:'del-row-btn',title:'Remove row',onClick:()=>delRow(si,ri)},'✕')
              )
            ),
            canEdit && h('div',{className:'add-row-wrap'},h('button',{className:'add-row-btn',onClick:()=>addRow(si)},'+ add row'))
          )
        )
      ),
      h('div',{className:'song-footer'},`Key of ${fmt(currKey)} · ${scale.map(fmt).join(' · ')} · "7" = ${fmt(scale[4])}/${fmt(scale[6])}`)
    ),

    // STAGE DOCK
    stage && h('div',{className:'stage-dock'},
      h('div',{className:'dock-row'},
        h('button',{className:'dock-btn exit',onClick:()=>{setStage(false);setScrolling(false);}},'✕ Exit'),
        inSet && h('button',{className:'dock-btn',disabled:ctx.index===0,onClick:()=>ctx.goto(ctx.index-1,true),'aria-label':'Previous song'},'‹ Prev'),
        h('button',{className:'dock-btn play'+(scrolling?' on':''),onClick:()=>setScrolling(v=>!v)},scrolling?'❚❚ Pause':'▶ Scroll'),
        inSet && h('button',{className:'dock-btn',disabled:ctx.index>=lastIdx,onClick:()=>ctx.goto(ctx.index+1,true),'aria-label':'Next song'},'Next ›')
      ),
      h('div',{className:'dock-row'},
        speedBtn('Speed',speed,()=>setSpeed(v=>Math.max(1,v-1)),()=>setSpeed(v=>Math.min(10,v+1))),
        speedBtn('Size',sizeIdx+1,()=>setSizeIdx(v=>Math.max(0,v-1)),()=>setSizeIdx(v=>Math.min(STAGE_SIZES.length-1,v+1))),
        h('div',{className:'dock-group'},
          h('span',{className:'dock-lbl'},'Key'),
          h('button',{className:'dock-mini',onClick:()=>stepKey(-1),'aria-label':'Key down'},'♭'),
          h('span',{className:'dock-val key'},fmt(currKey)),
          h('button',{className:'dock-mini',onClick:()=>stepKey(1),'aria-label':'Key up'},'♯')
        )
      )
    )
  );
}

function SetlistPage({setlist, songs, setSetlists, canEdit, onBack, onOpen, onDeleted, toast}) {
  const [showPick, setShowPick] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const upd = fn => setSetlists(prev=>{ const n=clone(prev); const sl=n.find(x=>x.id===setlist.id); if(sl) fn(sl); return n; });
  const songById = id => songs.find(s=>s.id===id);
  const effKey = it => it.key || (songById(it.songId)||{}).defaultKey || 'C';
  const stepKey = (i,dir) => {
    const cur = KEY_CYCLE.indexOf(effKey(setlist.items[i]));
    const k = KEY_CYCLE[(cur+dir+KEY_CYCLE.length)%KEY_CYCLE.length];
    upd(sl=>{ sl.items[i].key=k; });
  };
  const move = (i,d) => upd(sl=>{ const j=i+d; if(j<0||j>=sl.items.length) return; const t=sl.items[i]; sl.items[i]=sl.items[j]; sl.items[j]=t; });
  const remove = i => upd(sl=>{ sl.items.splice(i,1); });
  const addSong = id => { upd(sl=>{ sl.items.push({songId:id,key:null,note:''}); }); toast('Added'); };

  const url = location.href.split('#')[0] + '#/setlist/' + encodeURIComponent(setlist.id);
  const copyLink = () => {
    const done = () => toast('Link copied');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,()=>prompt('Copy this link:',url));
    else prompt('Copy this link:',url);
  };
  const waText = '*'+(setlist.name||'Setlist')+'*'+(setlist.date?' ('+fmtDate(setlist.date)+')':'')+'\n'+
    setlist.items.map((it,i)=>{ const s=songById(it.songId); return (i+1)+'. '+(s?s.title:'(song removed)')+(s&&s.artist?' – '+s.artist:'')+' ['+fmt(effKey(it))+']'+(it.note?' · '+it.note:''); }).join('\n')+
    '\n\nChord charts: '+url;

  return h('div',{className:'setlist-page'},
    showPick && h(PickSongDialog,{songs,items:setlist.items,onAdd:addSong,onClose:()=>setShowPick(false)}),
    confirmDel && h(ConfirmDialog,{
      title:'Delete this setlist?',message:`"${setlist.name||'Setlist'}" will be removed. The songs themselves are not affected.`,
      onConfirm:()=>{ setConfirmDel(false); onDeleted(setlist.id); },onCancel:()=>setConfirmDel(false),danger:'Delete'
    }),
    h('div',{className:'song-nav'},
      h('button',{className:'back-btn',onClick:onBack},'← Setlists'),
      h('img',{className:'nav-logo',src:LOGO,alt:'Kosmus Karangpanas'}),
      h('div',{className:'song-nav-title'},setlist.name||'Setlist'),
      canEdit && h('div',{className:'song-nav-right'},
        h('button',{className:'song-reset-btn',onClick:()=>setConfirmDel(true)},'🗑 Delete')
      )
    ),
    h('div',{className:'song-content'},
      h('div',{className:'song-hero'},
        canEdit
          ? h('input',{className:'set-name-input',value:setlist.name,placeholder:'Setlist name',onChange:e=>upd(sl=>{sl.name=e.target.value;})})
          : h('h1',{},setlist.name||'Setlist'),
        canEdit
          ? h('input',{className:'set-date-input',type:'date',value:setlist.date||'',onChange:e=>upd(sl=>{sl.date=e.target.value;})})
          : h('p',{},[fmtDate(setlist.date), setlist.items.length+(setlist.items.length===1?' song':' songs')].filter(Boolean).join(' · '))
      ),
      h('div',{className:'set-actions'},
        h('button',{className:'pill',disabled:!setlist.items.length,onClick:()=>onOpen(0,true)},'▶ Start (stage mode)'),
        h('button',{className:'pill ghost',onClick:copyLink},'Copy link'),
        h('a',{className:'pill ghost',href:'https://wa.me/?text='+encodeURIComponent(waText),target:'_blank',rel:'noopener'},'WhatsApp')
      ),
      h('ul',{className:'set-items'},
        ...setlist.items.map((it,i)=>{
          const song = songById(it.songId);
          return h('li',{key:i+'-'+it.songId},
            h('div',{className:'set-item'},
              h('span',{className:'row-idx'},pad2(i+1)),
              h('div',{className:'set-item-main',role:'button',tabIndex:0,
                onClick:()=>song&&onOpen(i,false),
                onKeyDown:e=>{ if(song&&(e.key==='Enter'||e.key===' ')){e.preventDefault();onOpen(i,false);} }},
                h('span',{className:'row-title'},song?song.title:'(song removed)'),
                h('span',{className:'row-artist'},song&&song.artist?song.artist:''),
                (!canEdit&&it.note) && h('span',{className:'set-note'},it.note)
              ),
              canEdit && h('input',{className:'note-input',value:it.note||'',placeholder:'Note (e.g. Pembukaan)',
                onChange:e=>upd(sl=>{ sl.items[i].note=e.target.value; })}),
              h('div',{className:'set-key'},
                canEdit && h('button',{className:'key-step',onClick:()=>stepKey(i,-1),'aria-label':'Key down'},'♭'),
                h('span',{className:'key-chip'},fmt(effKey(it))),
                canEdit && h('button',{className:'key-step',onClick:()=>stepKey(i,1),'aria-label':'Key up'},'♯')
              ),
              canEdit
                ? h('div',{className:'set-ctl'},
                    h('button',{disabled:i===0,onClick:()=>move(i,-1),'aria-label':'Move up'},'▲'),
                    h('button',{disabled:i===setlist.items.length-1,onClick:()=>move(i,1),'aria-label':'Move down'},'▼'),
                    h('button',{className:'danger',onClick:()=>remove(i),'aria-label':'Remove'},'✕'))
                : h('span',{className:'row-go','aria-hidden':'true'},'→')
            )
          );
        })
      ),
      setlist.items.length===0 && h('div',{className:'empty-note'},canEdit?'No songs yet. Tap “Add songs” to build this setlist.':'This setlist has no songs yet.'),
      canEdit && h('div',{className:'set-add'},h('button',{className:'pill',onClick:()=>setShowPick(true)},'+ Add songs'))
    )
  );
}
